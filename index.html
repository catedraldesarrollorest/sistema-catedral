<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>La Catedral - Sistema de Gestion Integral</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap');

  :root {
    --burgundy: #5C1A1B;
    --burgundy-dark: #3E0E0F;
    --gold: #C8922A;
    --gold-light: #E8B94A;
    --cream: #FDF6EC;
    --cream-dark: #F5EBD8;
    --text-dark: #2C1810;
    --text-muted: #7A6B5D;
    --card-border: #E8DCC8;
    --shadow: rgba(92, 26, 27, 0.08);
    --success: #2E7D32;
    --error: #C62828;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text-dark);
  }

  .header {
    background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy));
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 24px var(--shadow), 0 1px 4px var(--shadow);
    max-width: 460px;
    width: 100%;
    overflow: hidden;
  }

  .logo-section {
    text-align: center;
    padding: 36px 24px 20px;
  }
  .fleur {
    font-size: 52px;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 4px rgba(200,146,42,0.3));
  }
  .logo-title {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--text-dark);
    letter-spacing: 1px;
  }
  .logo-subtitle {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .screen { display: none; padding: 0 28px 32px; }
  .screen.active { display: block; animation: fadeIn 0.3s ease; }

  .section-label {
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 18px;
    font-weight: 400;
  }

  .dept-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }

  .dept-card {
    background: white;
    border: 2px solid var(--card-border);
    border-radius: 12px;
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dept-card:hover {
    border-color: var(--gold);
    box-shadow: 0 2px 12px rgba(200,146,42,0.15);
    transform: translateY(-1px);
  }
  .dept-card.selected {
    border-color: var(--gold);
    background: linear-gradient(to bottom, #FFF9EF, #FFF5E0);
    box-shadow: 0 2px 12px rgba(200,146,42,0.2);
  }
  .dept-icon {
    font-size: 32px;
    display: block;
    margin-bottom: 8px;
  }
  .dept-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dark);
  }

  .pin-section { margin-top: 8px; }
  .pin-label {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .pin-dot {
    width: 52px;
    height: 52px;
    border: 2px solid var(--card-border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-dark);
    background: white;
    transition: all 0.2s;
  }
  .pin-dot.filled {
    border-color: var(--gold);
    background: #FFFBF2;
  }
  .pin-dot.active {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(200,146,42,0.15);
  }
  .pin-dot.error-dot {
    border-color: var(--error);
    background: #FFF5F5;
    color: var(--error);
  }
  .pin-dot.success-dot {
    border-color: var(--success);
    background: #F1F8E9;
    color: var(--success);
  }

  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 280px;
    margin: 0 auto;
  }
  .numpad-btn {
    background: var(--cream);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px;
    font-size: 22px;
    font-weight: 600;
    font-family: 'Montserrat', sans-serif;
    color: var(--text-dark);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .numpad-btn:hover { background: var(--cream-dark); }
  .numpad-btn:active {
    background: var(--gold);
    color: white;
    transform: scale(0.96);
  }
  .numpad-btn.action {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border-color: transparent;
  }
  .numpad-btn.action:hover { color: var(--burgundy); background: var(--cream); }

  .status {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    font-weight: 500;
    min-height: 20px;
    transition: opacity 0.3s;
  }
  .status.error { color: var(--error); }
  .status.success { color: var(--success); }
  .status.loading { color: var(--text-muted); }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 8px 0;
    margin-bottom: 10px;
    transition: color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn:hover { color: var(--burgundy); }

  .dashboard-header {
    background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy));
    color: white;
    padding: 24px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dashboard-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
  }
  .dashboard-header .dept-badge {
    background: rgba(255,255,255,0.15);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .dashboard-body { padding: 28px; }
  .dashboard-welcome {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .dash-card {
    background: var(--cream);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .dash-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px var(--shadow);
  }
  .dash-card-icon { font-size: 28px; margin-bottom: 6px; }
  .dash-card-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .logout-btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: var(--cream);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--burgundy);
    cursor: pointer;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .logout-btn:hover { background: var(--cream-dark); }

  .conn-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid var(--card-border);
    margin-top: 16px;
  }
  .conn-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .conn-dot.ok { background: var(--success); }
  .conn-dot.err { background: var(--error); }
  .conn-dot.pending { background: #F39C12; animation: pulse 1.2s infinite; }

  .footer {
    background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy));
    padding: 14px;
    text-align: center;
  }
  .footer span {
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    letter-spacing: 1px;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--card-border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @media (max-width: 480px) {
    .main { padding: 12px; }
    .logo-title { font-size: 26px; }
    .pin-dot { width: 46px; height: 46px; font-size: 20px; }
    .numpad { max-width: 260px; gap: 8px; }
    .numpad-btn { padding: 12px; font-size: 20px; }
  }
</style>
</head>
<body>

<div class="header"></div>

<div class="main">
  <div class="container">
    <div class="logo-section">
      <span class="fleur">&#9884;</span>
      <div class="logo-title">La Catedral</div>
      <div class="logo-subtitle">Sistema de Gestion Integral</div>
    </div>

    <!-- PANTALLA 1: Seleccion de Departamento -->
    <div class="screen active" id="screenDept">
      <p class="section-label">Seleccione su departamento e ingrese el PIN</p>
      <div class="dept-grid">
        <div class="dept-card" data-dept="Administracion" onclick="selectDept(this)">
          <span class="dept-icon">&#x1F451;</span>
          <span class="dept-name">Administracion</span>
        </div>
        <div class="dept-card" data-dept="RRHH" onclick="selectDept(this)">
          <span class="dept-icon">&#x1F465;</span>
          <span class="dept-name">RRHH</span>
        </div>
        <div class="dept-card" data-dept="Juridico" onclick="selectDept(this)">
          <span class="dept-icon">&#9878;</span>
          <span class="dept-name">Juridico</span>
        </div>
        <div class="dept-card" data-dept="Contabilidad" onclick="selectDept(this)">
          <span class="dept-icon">&#x1F4CA;</span>
          <span class="dept-name">Contabilidad</span>
        </div>
      </div>
    </div>

    <!-- PANTALLA 2: Entrada de PIN -->
    <div class="screen" id="screenPin">
      <button class="back-btn" onclick="pinBack()">&#8592; Cambiar departamento</button>
      <div class="pin-section">
        <div class="pin-label">PIN de acceso (4 digitos)</div>
        <div class="pin-dots" id="pinDots">
          <div class="pin-dot active" id="dot0"></div>
          <div class="pin-dot" id="dot1"></div>
          <div class="pin-dot" id="dot2"></div>
          <div class="pin-dot" id="dot3"></div>
        </div>
        <div class="numpad">
          <button class="numpad-btn" onclick="pinInput(1)">1</button>
          <button class="numpad-btn" onclick="pinInput(2)">2</button>
          <button class="numpad-btn" onclick="pinInput(3)">3</button>
          <button class="numpad-btn" onclick="pinInput(4)">4</button>
          <button class="numpad-btn" onclick="pinInput(5)">5</button>
          <button class="numpad-btn" onclick="pinInput(6)">6</button>
          <button class="numpad-btn" onclick="pinInput(7)">7</button>
          <button class="numpad-btn" onclick="pinInput(8)">8</button>
          <button class="numpad-btn" onclick="pinInput(9)">9</button>
          <button class="numpad-btn action" onclick="pinClear()">Borrar</button>
          <button class="numpad-btn" onclick="pinInput(0)">0</button>
          <button class="numpad-btn action" onclick="pinDelete()">&#9003;</button>
        </div>
        <div class="status" id="pinStatus"></div>
      </div>
    </div>

    <!-- PANTALLA 3: Dashboard -->
    <div class="screen" id="screenDash">
      <div class="dashboard-header" style="margin: 0 -28px;">
        <h2>La Catedral</h2>
        <span class="dept-badge" id="dashDept"></span>
      </div>
      <div class="dashboard-body" style="padding: 28px 0 0;">
        <p class="dashboard-welcome">Bienvenido al sistema de gestion. Seleccione una opcion para continuar.</p>
        <div class="dashboard-grid" id="dashGrid">
          <!-- Se llena dinamicamente -->
        </div>
        <div class="conn-bar" id="connBar">
          <span class="conn-dot pending"></span>
          <span>Verificando conexion...</span>
        </div>
        <button class="logout-btn" onclick="logout()">Cerrar sesion</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <span>La Catedral &copy; 2026</span>
</div>

<script>
// =============================================================
// CONFIGURACION
// =============================================================

// URL del webhook de n8n (tu webhook real activo)
var N8N_WEBHOOK = "https://catedraldesarrollorest.app.n8n.cloud/webhook/9975daf2-0cc8-4bf1-bcab-93b1022abc2d";

// PINs locales de respaldo por departamento
var LOCAL_PINS = {
  "Administracion": "1234",
  "RRHH": "5678",
  "Juridico": "9012",
  "Contabilidad": "3456"
};

// Menus por departamento
var DEPT_MENUS = {
  "Administracion": [
    { icon: "&#x1F4CB;", label: "Reportes" },
    { icon: "&#x1F464;", label: "Personal" },
    { icon: "&#x1F4CA;", label: "Estadisticas" },
    { icon: "&#9881;", label: "Ajustes" }
  ],
  "RRHH": [
    { icon: "&#x1F4DD;", label: "Nomina" },
    { icon: "&#x1F4C5;", label: "Asistencia" },
    { icon: "&#x1F393;", label: "Capacitacion" },
    { icon: "&#x1F4C2;", label: "Expedientes" }
  ],
  "Juridico": [
    { icon: "&#x1F4DC;", label: "Contratos" },
    { icon: "&#x1F50D;", label: "Consultas" },
    { icon: "&#x1F4C1;", label: "Expedientes" },
    { icon: "&#9200;", label: "Vencimientos" }
  ],
  "Contabilidad": [
    { icon: "&#x1F4B0;", label: "Ingresos" },
    { icon: "&#x1F4C9;", label: "Egresos" },
    { icon: "&#x1F9FE;", label: "Facturas" },
    { icon: "&#x1F4C8;", label: "Balance" }
  ]
};

// =============================================================
// ESTADO
// =============================================================
var selectedDept = "";
var pin = [];
var isVerifying = false;

// =============================================================
// NAVEGACION ENTRE PANTALLAS
// =============================================================
function showScreen(id) {
  var screens = document.querySelectorAll(".screen");
  for (var i = 0; i < screens.length; i++) {
    screens[i].classList.remove("active");
  }
  var target = document.getElementById(id);
  if (target) {
    target.classList.add("active");
  }
}

function pinNav(screenId) {
  showScreen(screenId);
}

// =============================================================
// SELECCION DE DEPARTAMENTO
// =============================================================
function selectDept(card) {
  var cards = document.querySelectorAll(".dept-card");
  for (var i = 0; i < cards.length; i++) {
    cards[i].classList.remove("selected");
  }
  card.classList.add("selected");
  selectedDept = card.getAttribute("data-dept");

  pinClear();
  setTimeout(function() {
    showScreen("screenPin");
  }, 200);
}

// =============================================================
// PIN: VOLVER A DEPARTAMENTOS
// =============================================================
function pinBack() {
  selectedDept = "";
  pinClear();
  setStatus("", "");
  var cards = document.querySelectorAll(".dept-card");
  for (var i = 0; i < cards.length; i++) {
    cards[i].classList.remove("selected");
  }
  showScreen("screenDept");
}

// =============================================================
// PIN: INGRESAR DIGITO
// =============================================================
function pinInput(num) {
  if (pin.length >= 4 || isVerifying) return;
  pin.push(num);
  updatePinDots();

  if (pin.length === 4) {
    verifyPin();
  }
}

// =============================================================
// PIN: BORRAR ULTIMO
// =============================================================
function pinDelete() {
  if (pin.length === 0 || isVerifying) return;
  pin.pop();
  updatePinDots();
  setStatus("", "");
}

// =============================================================
// PIN: BORRAR TODO
// =============================================================
function pinClear() {
  pin = [];
  isVerifying = false;
  updatePinDots();
  setStatus("", "");
}

// =============================================================
// ACTUALIZAR VISUAL DE DOTS
// =============================================================
function updatePinDots() {
  for (var i = 0; i < 4; i++) {
    var dot = document.getElementById("dot" + i);
    if (!dot) continue;

    dot.className = "pin-dot";
    if (i < pin.length) {
      dot.textContent = "\u25CF";
      dot.classList.add("filled");
    } else {
      dot.textContent = "";
      if (i === pin.length && pin.length < 4) {
        dot.classList.add("active");
      }
    }
  }
}

// =============================================================
// MOSTRAR ESTADO
// =============================================================
function setStatus(message, type) {
  var el = document.getElementById("pinStatus");
  if (!el) return;
  el.className = "status " + (type || "");
  el.innerHTML = message;
}

// =============================================================
// VERIFICAR PIN
// =============================================================
function verifyPin() {
  var pinStr = pin.join("");
  isVerifying = true;
  setStatus('<span class="spinner"></span> Verificando...', "loading");

  // Primero intentar verificar con Google Sheets via n8n
  verifyWithSheets(selectedDept, pinStr)
    .then(function(result) {
      isVerifying = false;
      if (result.success) {
        markDotsSuccess();
        setStatus("\u2713 Acceso concedido", "success");
        setTimeout(function() {
          openDashboard();
        }, 600);
      } else {
        markDotsError();
        setStatus("\u2717 PIN incorrecto. Intente de nuevo.", "error");
        shakePinDots();
        setTimeout(function() {
          pinClear();
        }, 900);
      }
    })
    .catch(function(err) {
      console.log("Sheets no disponible, verificando con PIN local:", err.message || err);
      // Fallback: verificar con PINs locales
      var localPin = LOCAL_PINS[selectedDept] || "";
      isVerifying = false;

      if (pinStr === localPin) {
        markDotsSuccess();
        setStatus("\u2713 Acceso concedido (modo local)", "success");
        setTimeout(function() {
          openDashboard();
        }, 600);
      } else {
        markDotsError();
        setStatus("\u2717 PIN incorrecto. Intente de nuevo.", "error");
        shakePinDots();
        setTimeout(function() {
          pinClear();
        }, 900);
      }
    });
}

// =============================================================
// VERIFICAR CON GOOGLE SHEETS VIA N8N
// =============================================================
function verifyWithSheets(dept, pinStr) {
  return new Promise(function(resolve, reject) {
    // Enviar al webhook de n8n con accion verify_pin
    var url = N8N_WEBHOOK + "?action=verify_pin&dept=" + encodeURIComponent(dept) + "&pin=" + encodeURIComponent(pinStr);

    var controller = null;
    var timeoutId = null;

    // Timeout de 5 segundos
    if (typeof AbortController !== "undefined") {
      controller = new AbortController();
      timeoutId = setTimeout(function() {
        controller.abort();
      }, 5000);
    }

    var fetchOptions = {
      method: "GET",
      mode: "cors"
    };
    if (controller) {
      fetchOptions.signal = controller.signal;
    }

    fetch(url, fetchOptions)
      .then(function(response) {
        if (timeoutId) clearTimeout(timeoutId);
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.json();
      })
      .then(function(data) {
        if (data && data.success === true) {
          resolve({ success: true });
        } else {
          // Si el webhook responde pero no con success, usar fallback local
          throw new Error("Webhook no tiene verify_pin configurado");
        }
      })
      .catch(function(err) {
        if (timeoutId) clearTimeout(timeoutId);
        reject(err);
      });
  });
}

// =============================================================
// MARCAR DOTS COMO ERROR / EXITO
// =============================================================
function markDotsError() {
  for (var i = 0; i < 4; i++) {
    var dot = document.getElementById("dot" + i);
    if (dot) {
      dot.classList.remove("filled", "active");
      dot.classList.add("error-dot");
    }
  }
}

function markDotsSuccess() {
  for (var i = 0; i < 4; i++) {
    var dot = document.getElementById("dot" + i);
    if (dot) {
      dot.classList.remove("filled", "active");
      dot.classList.add("success-dot");
    }
  }
}

// =============================================================
// EFECTO SHAKE
// =============================================================
function shakePinDots() {
  var container = document.getElementById("pinDots");
  if (container) {
    container.classList.add("shake");
    setTimeout(function() {
      container.classList.remove("shake");
    }, 500);
  }
}

// =============================================================
// ABRIR DASHBOARD
// =============================================================
function openDashboard() {
  var badge = document.getElementById("dashDept");
  if (badge) {
    badge.textContent = selectedDept;
  }

  // Generar menu dinamico segun departamento
  var grid = document.getElementById("dashGrid");
  if (grid) {
    grid.innerHTML = "";
    var menuItems = DEPT_MENUS[selectedDept] || [];
    for (var i = 0; i < menuItems.length; i++) {
      (function(item) {
        var card = document.createElement("div");
        card.className = "dash-card";
        card.innerHTML = '<div class="dash-card-icon">' + item.icon + '</div><div class="dash-card-label">' + item.label + '</div>';
        card.onclick = function() {
          alert("Modulo: " + item.label + "\nProximamente disponible.");
        };
        grid.appendChild(card);
      })(menuItems[i]);
    }
  }

  showScreen("screenDash");

  // Verificar conexion con n8n
  checkConnection();
}

// =============================================================
// CERRAR SESION
// =============================================================
function logout() {
  selectedDept = "";
  pinClear();
  setStatus("", "");
  var cards = document.querySelectorAll(".dept-card");
  for (var i = 0; i < cards.length; i++) {
    cards[i].classList.remove("selected");
  }
  showScreen("screenDept");
}

// =============================================================
// VERIFICAR CONEXION CON N8N / SHEETS
// =============================================================
function checkConnection() {
  var bar = document.getElementById("connBar");
  if (!bar) return;
  bar.innerHTML = '<span class="conn-dot pending"></span><span>Verificando conexion con n8n...</span>';

  fetch(N8N_WEBHOOK + "?action=ping", {
    method: "GET",
    mode: "no-cors"
  }).then(function() {
    bar.innerHTML = '<span class="conn-dot ok"></span><span>n8n conectado &middot; Webhook activo</span>';
  }).catch(function(err) {
    bar.innerHTML = '<span class="conn-dot err"></span><span>Sin conexion a n8n</span>';
    console.log("Connection check:", err);
  });
}

// =============================================================
// INICIALIZACION
// =============================================================
updatePinDots();
</script>

</body>
</html>
