function renderIncidencias(container) {
  const canAdd = currentRole==='contabilidad'||currentRole==='admin';
  document.getElementById('topbar-actions').innerHTML = canAdd?`<button class="btn btn-primary btn-sm" onclick="openModalIncidencia()">➕ Nueva Incidencia</button>`:'';
  container.innerHTML = `
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Empleado</th><th>Período</th><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Días</th><th>Impacto Nómina</th>${currentRole==='admin'?'<th>Eliminar</th>':''}</tr></thead>
          <tbody>${STATE.incidencias.length?STATE.incidencias.slice().reverse().map(i=>{
            const e=STATE.empleados.find(x=>x.id===i.empleadoId);
            const impacto = i.tipo==='Permiso no retribuido'||i.tipo==='Ausencia injustificada'?'⬇️ Descuenta días':'ℹ️ Sin descuento';
            return `<tr>
              <td>${e?`${e.nombres} ${e.apellidos}`:'—'}</td>
              <td>${i.periodo||'—'}</td>
              <td><span class="badge badge-info">${i.tipo}</span></td>
              <td>${fmtDate(i.fechaInicio)}</td><td>${fmtDate(i.fechaFin)}</td>
              <td><b>${i.diasAfectados}</b></td>
              <td><small>${impacto}</small></td>
              ${currentRole==='admin'?`<td><button class="btn btn-danger btn-xs" onclick="eliminarIncidencia('${i.id}')">🗑️</button></td>`:''}
            </tr>`;
          }).join('') : `<tr><td colspan="8" class="text-center text-muted" style="padding:40px">No hay incidencias registradas</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

function openModalIncidencia() {
  const activos = getEmpleadosActivos();
  const tipos = ['Baja médica','Permiso retribuido','Permiso no retribuido','Ausencia injustificada','Vacaciones'];
  const impactoInfo = {
    'Baja médica':'Sin descuento en días trabajados (registro de control)',
    'Permiso retribuido':'Sin descuento en días trabajados',
    'Permiso no retribuido':'Descuenta días trabajados',
    'Ausencia injustificada':'Descuenta días trabajados',
    'Vacaciones':'Se aplicará bonificación de 15 días pagados por cada 7 días de descanso'
  };
  let body = `<div class="form-grid">
    <div class="form-group full"><label class="field-label required">Empleado</label>
      <select id="inc-emp"><option value="">Seleccione...</option>
        ${activos.map(e=>`<option value="${e.id}">${e.nombres} ${e.apellidos}</option>`).join('')}
      </select></div>
    <div class="form-group"><label class="field-label required">Tipo</label>
      <select id="inc-tipo" onchange="updateImpactoInfo()">${tipos.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="form-group"><label class="field-label required" data-tip="Año y mes para asociar a la nómina">Período (Año-Mes)</label>
      <input type="month" id="inc-periodo" value="${new Date().toISOString().slice(0,7)}"></div>
    <div class="form-group"><label class="field-label required">Fecha Inicio</label><input type="date" id="inc-inicio" onchange="calcDiasInc()"></div>
    <div class="form-group"><label class="field-label required">Fecha Fin</label><input type="date" id="inc-fin" onchange="calcDiasInc()"></div>
    <div class="form-group"><label class="field-label" data-tip="Calculado automáticamente">Días Afectados</label><input type="number" id="inc-dias" readonly></div>
    <div class="form-group full" id="inc-impacto-info"><div class="input-hint">ℹ️ Seleccione el tipo de incidencia</div></div>
  </div>`;
  openModal('📅 Registrar Incidencia', body,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="guardarIncidencia()">Guardar</button>`);
  setTimeout(() => updateImpactoInfo(), 100);
}

function updateImpactoInfo() {
  const tipo = document.getElementById('inc-tipo')?.value;
  const info = { 'Baja médica':'Sin descuento en días trabajados', 'Permiso retribuido':'Sin descuento en días trabajados', 'Permiso no retribuido':'Descuenta días de nómina', 'Ausencia injustificada':'Descuenta días de nómina', 'Vacaciones':'Suma 15 días pagados por cada 7 días de descanso registrados' };
  const div = document.getElementById('inc-impacto-info');
  if (div && tipo) div.innerHTML = `<div class="input-hint">ℹ️ ${info[tipo]||''}</div>`;
}

function calcDiasInc() {
  const inicio = document.getElementById('inc-inicio')?.value;
  const fin = document.getElementById('inc-fin')?.value;
  const diasEl = document.getElementById('inc-dias');
  if (!inicio || !fin || !diasEl) return;
  const diff = (new Date(fin)-new Date(inicio))/(1000*60*60*24)+1;
  diasEl.value = diff > 0 ? diff : 0;
}

function guardarIncidencia() {
  const empId = document.getElementById('inc-emp').value;
  const tipo = document.getElementById('inc-tipo').value;
  const periodo = document.getElementById('inc-periodo').value;
  const fechaInicio = document.getElementById('inc-inicio').value;
  const fechaFin = document.getElementById('inc-fin').value;
  const diasAfectados = parseInt(document.getElementById('inc-dias').value)||0;
  if (!empId||!fechaInicio||!fechaFin||!periodo) { showToast('Complete todos los campos','warning'); return; }
  if (diasAfectados <= 0) { showToast('Las fechas deben generar al menos 1 día','warning'); return; }

  const inc = { id:'I'+uid(), empleadoId:empId, tipo, periodo, fechaInicio, fechaFin, diasAfectados };

  // Si es permiso no retribuido o ausencia, actualizar días trabajados en nómina
  if (tipo==='Permiso no retribuido'||tipo==='Ausencia injustificada') {
    const nomina = STATE.nominas.find(n=>n.periodo===periodo);
    if (nomina) {
      const linea = nomina.lineas.find(l=>l.empleadoId===empId);
      if (linea) { linea.diasTrabajados = Math.max(0, linea.diasTrabajados - diasAfectados); }
    }
  }

  // Control vacaciones
  if (tipo==='Vacaciones') {
    let ctrl = STATE.vacacionesControl.find(v=>v.empleadoId===empId && v.ano===new Date(fechaInicio).getFullYear());
    if (!ctrl) { ctrl = { empleadoId:empId, ano:new Date(fechaInicio).getFullYear(), diasTomados:0 }; STATE.vacacionesControl.push(ctrl); }
    ctrl.diasTomados += diasAfectados;
  }

  STATE.incidencias.push(inc);
  saveState();
  const emp = STATE.empleados.find(e=>e.id===empId);
  addAuditLog('INCIDENCIA',`Incidencia (${tipo}) para ${emp.nombres} ${emp.apellidos}: ${diasAfectados} días`);
  showToast('Incidencia registrada','success');
  closeModal();
  renderIncidencias(document.getElementById('app-content'));
}

function eliminarIncidencia(id) {
  confirmAction('¿Eliminar esta incidencia? Esta acción queda en auditoría.', function(){
    const idx = STATE.incidencias.findIndex(i=>i.id===id);
    if (idx>-1) { STATE.incidencias.splice(idx,1); saveState(); addAuditLog('ELIMINAR_INCIDENCIA','Incidencia eliminada por Admin'); showToast('Incidencia eliminada','info'); renderIncidencias(document.getElementById('app-content')); }
  });
}

// ============================================================
// VACACIONES
// ============================================================
function renderVacaciones(container) {
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-secondary btn-sm" onclick="exportVacaciones()">⬇️ Excel</button>`;
  const activos = getEmpleadosActivos();
  const anoActual = new Date().getFullYear();
  container.innerHTML = `
    <div class="card">
      <div class="card-header"><h3>🌴 Submayor de Vacaciones ${anoActual}</h3>
        <span class="text-muted" style="font-size:13px">Derecho anual: ${STATE.config.diasVacaciones} días | Pagados por período: ${STATE.config.diasPagadosPeriodo} días</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Empleado</th><th>Dpto</th><th>Derecho Anual</th><th>Días Tomados</th><th>Días Pendientes</th><th>Valor Monetario Pendiente</th><th>Progreso</th></tr></thead>
          <tbody>${activos.map(e=>{
            const ctrl = STATE.vacacionesControl.find(v=>v.empleadoId===e.id&&v.ano===anoActual);
            const tomados = ctrl?.diasTomados||0;
            const pendientes = Math.max(0, STATE.config.diasVacaciones - tomados);
            const salDiario = (e.salarioBase||0)/(e.jornada||24);
            const valPend = salDiario * pendientes;
            const pct = Math.min(100, (tomados/STATE.config.diasVacaciones)*100);
            return `<tr>
              <td><b>${e.nombres} ${e.apellidos}</b></td>
              <td>${e.departamento}</td>
              <td>${STATE.config.diasVacaciones} días</td>
              <td>${tomados}</td>
              <td><b style="color:var(--burgundy)">${pendientes}</b></td>
              <td>${fmtMoney(valPend)}</td>
              <td><div class="progress-bar-wrap" style="min-width:80px"><div class="progress-bar" style="width:${pct}%"></div></div><small>${pct.toFixed(0)}%</small></td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

function exportVacaciones() {
  const activos = getEmpleadosActivos();
  const anoActual = new Date().getFullYear();
  const data = activos.map(e=>{
    const ctrl = STATE.vacacionesControl.find(v=>v.empleadoId===e.id&&v.ano===anoActual);
    const tomados = ctrl?.diasTomados||0;
    const pendientes = Math.max(0, STATE.config.diasVacaciones-tomados);
    const salDiario = (e.salarioBase||0)/(e.jornada||24);
    return { Empleado:`${e.nombres} ${e.apellidos}`, Departamento:e.departamento, 'Derecho Anual':STATE.config.diasVacaciones, 'Días Tomados':tomados, 'Días Pendientes':pendientes, 'Valor Pendiente':salDiario*pendientes };
  });
  exportToExcel(data, `Vacaciones_${anoActual}`);
  showToast('Exportado','success');
}

// ============================================================
// CONFIGURACIÓN
// ============================================================
function renderConfiguracion(container) {
  if (currentRole !== 'admin') { container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔒</div><h4>Solo Administración</h4></div>'; return; }
  const cfg = STATE.config;
  container.innerHTML = `
    <div class="card">
      <div class="card-header"><h3>⚙️ Configuración General</h3></div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-section-title">🔐 Gestión de PINs</div>
          <div class="form-group"><label class="field-label">PIN RRHH</label>
            <div style="display:flex;gap:8px"><input type="password" id="cfg-pin-rrhh" value="${cfg.pins.rrhh}" maxlength="4" style="font-family:monospace;letter-spacing:4px" autocomplete="new-password">
            <button class="btn btn-secondary btn-sm" onclick="togglePinVis('cfg-pin-rrhh',this)">👁️</button></div>
            <div class="input-hint">PIN actual de RRHH (4 dígitos)</div></div>
          <div class="form-group"><label class="field-label">PIN Jurídico</label>
            <div style="display:flex;gap:8px"><input type="password" id="cfg-pin-jur" value="${cfg.pins.juridico}" maxlength="4" style="font-family:monospace;letter-spacing:4px" autocomplete="new-password">
            <button class="btn btn-secondary btn-sm" onclick="togglePinVis('cfg-pin-jur',this)">👁️</button></div></div>
          <div class="form-group"><label class="field-label">PIN Contabilidad</label>
            <div style="display:flex;gap:8px"><input type="password" id="cfg-pin-cont" value="${cfg.pins.contabilidad}" maxlength="4" style="font-family:monospace;letter-spacing:4px" autocomplete="new-password">
            <button class="btn btn-secondary btn-sm" onclick="togglePinVis('cfg-pin-cont',this)">👁️</button></div></div>
          <div class="form-group"><label class="field-label" data-tip="El PIN de Administración es fijo y no editable">PIN Admin (fijo)</label>
            <input type="text" value="****" readonly style="color:var(--text-light)">
            <div class="input-hint">PIN 1059 — no editable por diseño</div></div>

          <div class="form-section-title">💰 Bonificación por Antigüedad</div>
          <div class="form-group"><label class="field-label" data-tip="Mínimo de años para el primer nivel de bonificación">Años para nivel 1 (5%)</label>
            <input type="number" id="cfg-bon-anos1" value="${cfg.bonificacion.anios1}" min="1"></div>
          <div class="form-group"><label class="field-label">Porcentaje nivel 1 (%)</label>
            <input type="number" id="cfg-bon-pct1" value="${cfg.bonificacion.nivel1}" min="0" max="100"></div>
          <div class="form-group"><label class="field-label" data-tip="Mínimo de años para el segundo nivel de bonificación">Años para nivel 2 (10%)</label>
            <input type="number" id="cfg-bon-anos2" value="${cfg.bonificacion.anios2}" min="1"></div>
          <div class="form-group"><label class="field-label">Porcentaje nivel 2 (%)</label>
            <input type="number" id="cfg-bon-pct2" value="${cfg.bonificacion.nivel2}" min="0" max="100"></div>

          <div class="form-section-title">⏱️ Horas Extras y Vacaciones</div>
          <div class="form-group"><label class="field-label" data-tip="Porcentaje de recargo sobre hora ordinaria para horas extras">Recargo Horas Extras (%)</label>
            <input type="number" id="cfg-recargo" value="${cfg.recargoHorasExtras}" min="0" max="200"></div>
          <div class="form-group"><label class="field-label" data-tip="Días de vacaciones anuales a los que tiene derecho cada empleado">Días de Vacaciones/Año</label>
            <input type="number" id="cfg-vac-dias" value="${cfg.diasVacaciones}" min="1"></div>
          <div class="form-group"><label class="field-label" data-tip="Días que se pagan por cada período vacacional tomado">Días Pagados/Período</label>
            <input type="number" id="cfg-vac-pag" value="${cfg.diasPagadosPeriodo}" min="1"></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="guardarConfiguracion()">💾 Guardar Configuración</button>
        </div>
      </div>
    </div>`;
}

function togglePinVis(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
  else { input.type = 'password'; btn.textContent = '👁️'; }
}

function guardarConfiguracion() {
  const pinRrhh = document.getElementById('cfg-pin-rrhh').value.trim();
  const pinJur = document.getElementById('cfg-pin-jur').value.trim();
  const pinCont = document.getElementById('cfg-pin-cont').value.trim();
  if ([pinRrhh,pinJur,pinCont].some(p=>!/^\d{4}$/.test(p))) { showToast('Todos los PINs deben tener exactamente 4 dígitos numéricos','error'); return; }
  if ([pinRrhh,pinJur,pinCont].includes(STATE.config.adminPin)) { showToast('Un PIN no puede ser igual al PIN de Administración','error'); return; }
  STATE.config.pins.rrhh = pinRrhh;
  STATE.config.pins.juridico = pinJur;
  STATE.config.pins.contabilidad = pinCont;
  STATE.config.bonificacion.anios1 = parseInt(document.getElementById('cfg-bon-anos1').value)||5;
  STATE.config.bonificacion.nivel1 = parseInt(document.getElementById('cfg-bon-pct1').value)||5;
  STATE.config.bonificacion.anios2 = parseInt(document.getElementById('cfg-bon-anos2').value)||10;
  STATE.config.bonificacion.nivel2 = parseInt(document.getElementById('cfg-bon-pct2').value)||10;
  STATE.config.recargoHorasExtras = parseFloat(document.getElementById('cfg-recargo').value)||50;
  STATE.config.diasVacaciones = parseInt(document.getElementById('cfg-vac-dias').value)||14;
  STATE.config.diasPagadosPeriodo = parseInt(document.getElementById('cfg-vac-pag').value)||15;
  saveState();
  addAuditLog('CONFIG','Configuración general actualizada por Admin');
  showToast('Configuración guardada','success');
}

// ============================================================
// AUDITORÍA
// ============================================================
function renderAuditoria(container) {
  if (currentRole !== 'admin') { container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔒</div><h4>Solo Administración</h4></div>'; return; }
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-secondary btn-sm" onclick="exportAuditoria()">⬇️ Exportar</button>`;
  container.innerHTML = `
    <div class="card">
      <div class="filters-bar">
        <input type="text" id="aud-q" placeholder="🔍 Buscar en auditoría..." style="min-width:260px" oninput="filtrarAuditoria()">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha y Hora</th><th>Rol</th><th>Tipo</th><th>Detalle</th></tr></thead>
          <tbody id="aud-tbody">${renderAuditoriaRows(STATE.auditLog)}</tbody>
        </table>
      </div>
    </div>`;
}

function renderAuditoriaRows(logs) {
  if (!logs.length) return `<tr><td colspan="4" class="text-center text-muted" style="padding:40px">Sin registros</td></tr>`;
  return logs.slice(0,200).map(l=>`<tr class="audit-row">
    <td><code style="font-size:12px">${new Date(l.fecha).toLocaleString('es-ES')}</code></td>
    <td><span class="badge badge-info">${l.rol}</span></td>
    <td><span class="chip">${l.tipo}</span></td>
    <td>${l.detalle}</td>
  </tr>`).join('');
}

function filtrarAuditoria() {
  const q = document.getElementById('aud-q').value.toLowerCase();
  const filtered = STATE.auditLog.filter(l=>
    l.tipo.toLowerCase().includes(q)||l.detalle.toLowerCase().includes(q)||l.rol.toLowerCase().includes(q)
  );
  document.getElementById('aud-tbody').innerHTML = renderAuditoriaRows(filtered);
}

function exportAuditoria() {
  const data = STATE.auditLog.map(l=>({Fecha:new Date(l.fecha).toLocaleString('es-ES'),Rol:l.rol,Tipo:l.tipo,Detalle:l.detalle}));
  exportToExcel(data,'AuditoriaLog_LaCatedral');
  showToast('Exportado','success');
}

// ============================================================
// BACKUP
// ============================================================
function renderBackup(container) {
  if (currentRole !== 'admin') { container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔒</div><h4>Solo Administración</h4></div>'; return; }
  const stats = {
    empleados: STATE.empleados.length,
    nominas: STATE.nominas.length,
    sanciones: STATE.sanciones.length,
    auditLog: STATE.auditLog.length
  };
  container.innerHTML = `
    <div class="card" style="max-width:600px">
      <div class="card-header"><h3>💾 Copia de Seguridad</h3></div>
      <div class="card-body">
        <p style="color:var(--text-mid);margin-bottom:20px">Gestione las copias de seguridad del sistema. Los datos incluyen empleados, nóminas, contratos, sanciones, logs y toda la configuración.</p>
        <div class="stats-grid" style="margin-bottom:24px">
          <div class="stat-card"><div class="stat-value">${stats.empleados}</div><div class="stat-label">Empleados</div></div>
          <div class="stat-card"><div class="stat-value">${stats.nominas}</div><div class="stat-label">Nóminas</div></div>
          <div class="stat-card"><div class="stat-value">${stats.sanciones}</div><div class="stat-label">Sanciones</div></div>
          <div class="stat-card"><div class="stat-value">${stats.auditLog}</div><div class="stat-label">Logs</div></div>
        </div>
        <div class="divider"></div>
        <div style="display:flex;flex-direction:column;gap:16px">
          <div>
            <h4 style="margin-bottom:8px;color:var(--burgundy)">⬇️ Exportar Copia de Seguridad</h4>
            <p class="text-muted">Descarga todos los datos en formato JSON cifrado.</p>
            <button class="btn btn-primary" style="margin-top:10px" onclick="exportBackup()">💾 Descargar Backup</button>
          </div>
          <div class="divider"></div>
          <div>
            <h4 style="margin-bottom:8px;color:var(--burgundy)">⬆️ Restaurar desde Copia</h4>
            <p class="text-muted">⚠️ Esto reemplazará TODOS los datos actuales.</p>
            <div class="file-drop" style="margin-top:10px" onclick="document.getElementById('backup-file').click()">
              <div class="file-icon">📂</div><p>Clic para seleccionar archivo .json de backup</p>
              <input type="file" id="backup-file" accept="application/json,.json" style="display:none" onchange="previewBackup(this)">
              <span id="backup-file-name" class="text-muted"></span>
            </div>
            <button class="btn btn-danger" style="margin-top:10px" onclick="importBackup()">♻️ Restaurar Backup</button>
          </div>
        </div>
      </div>
    </div>`;
}

function exportBackup() {
  const json = JSON.stringify(STATE, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `LaCatedral_Backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  addAuditLog('BACKUP','Copia de seguridad exportada');
  showToast('Backup descargado','success');
}

function previewBackup(input) {
  const label = document.getElementById('backup-file-name');
  if (input.files[0]) label.textContent = '✅ ' + input.files[0].name;
}

function importBackup() {
  const input = document.getElementById('backup-file');
  if (!input.files[0]) { showToast('Seleccione un archivo de backup','warning'); return; }
  confirmAction('⚠️ ¿Restaurar backup? Se perderán los datos actuales.', function(){
    const r = new FileReader();
    r.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.empleados || !data.config) throw new Error('Formato inválido');
        STATE = data;
        saveState();
        addAuditLog('RESTORE','Datos restaurados desde backup');
        showToast('Backup restaurado correctamente','success');
        renderBackup(document.getElementById('app-content'));
      } catch(err) { showToast('Error al leer el backup: ' + err.message,'error'); }
    };
    r.readAsText(input.files[0]);
  });
}

// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  STATE = loadState();
  document.getElementById('p0').focus();
});
</script>
