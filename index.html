      <tbody id="hist-tbody"></tbody>
    </table></div></div>
  </div>`;
  cargarNomina();
}

function switchNominaTab(tab,el){
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  document.getElementById('nomina-nueva').style.display=tab==='nueva'?'block':'none';
  document.getElementById('nomina-historico').style.display=tab==='historico'?'block':'none';
  if(tab==='historico')renderHistoricoNominas();
}

function renderHistoricoNominas(){
  const tbody=document.getElementById('hist-tbody');if(!tbody)return;
  if(!STATE.nominas.length){tbody.innerHTML=`<tr><td colspan="5" class="text-center text-muted" style="padding:40px">Sin nóminas</td></tr>`;return}
  tbody.innerHTML=STATE.nominas.slice().reverse().map(n=>`<tr>
    <td><b>${n.mesNombre} ${n.ano}</b></td>
    <td><span class="badge badge-${n.estado==='aprobada'?'approved':n.estado==='pendiente'?'pending':'draft'}">${n.estado}</span></td>
    <td>${fmtMoney(n.totalDevengado)}</td><td>${n.lineas?n.lineas.length:0} empleados</td>
    <td>
      <button class="btn btn-secondary btn-xs" onclick="verDetalleNomina('${n.id}')">👁️ Ver</button>
      ${currentRole==='admin'&&n.estado==='aprobada'?`<button class="btn btn-warning btn-xs" onclick="reabrirNomina('${n.id}')">🔓</button>`:''}
      ${currentRole==='admin'&&n.estado==='pendiente'?`<button class="btn btn-success btn-xs" onclick="aprobarNomina('${n.id}')">✅</button>`:''}
    </td>
  </tr>`).join('');
}

function cargarNomina(){
  const mes=parseInt(document.getElementById('nom-mes').value);
  const ano=parseInt(document.getElementById('nom-ano').value);
  const mesNombre=new Date(ano,mes-1).toLocaleString('es-ES',{month:'long'});
  const periodoKey=`${ano}-${String(mes).padStart(2,'0')}`;
  let nomina=STATE.nominas.find(n=>n.periodo===periodoKey);
  const canEdit=currentRole==='contabilidad'||currentRole==='admin';
  const isReadOnly=nomina&&nomina.estado==='aprobada'&&currentRole!=='admin';
  const activos=getEmpleadosActivos();
  if(!nomina){
    nomina={id:'N'+uid(),periodo:periodoKey,mes,ano,mesNombre,estado:'borrador',lineas:[],totalDevengado:0};
    activos.forEach(e=>nomina.lineas.push({empleadoId:e.id,diasTrabajados:e.jornada||24,horasExtras:0}));
    STATE.nominas.push(nomina);saveState();
  } else {
    activos.forEach(e=>{if(!nomina.lineas.find(l=>l.empleadoId===e.id))nomina.lineas.push({empleadoId:e.id,diasTrabajados:e.jornada||24,horasExtras:0})});
    saveState();
  }
  let html=`<div class="card">
    <div class="card-header"><h3>Nómina: ${mesNombre} ${ano}</h3><span class="badge badge-${nomina.estado==='aprobada'?'approved':nomina.estado==='pendiente'?'pending':'draft'}">${nomina.estado}</span></div>
    <div class="table-wrap"><table class="nomina-table"><thead><tr>
      <th>Empleado</th><th>Dpto</th><th>Jornada</th>
      <th data-tip="Salario base mensual">Sal.Base</th>
      <th data-tip="Salario Base ÷ Jornada">Sal.Diario</th>
      <th data-tip="Bonificación por antigüedad">Bonif.</th>
      <th data-tip="Días efectivamente trabajados">Días Trab.</th>
      <th data-tip="Horas fuera de jornada">H.Extras</th>
      <th data-tip="(Sal.Diario÷8)×1.5">Val.HE</th>
      <th data-tip="Incidencias del mes">Incidencias</th>
      <th data-tip="Total a pagar">Total</th>
    </tr></thead><tbody>`;

  nomina.lineas.forEach(l=>{
    const e=STATE.empleados.find(x=>x.id===l.empleadoId);if(!e)return;
    const salBase=e.salarioBase||0;const jornC=e.jornada||24;
    const salDiario=salBase/jornC;const bon=calcBonificacion(salBase,e.fechaAlta);const bPct=getBonificacionPct(e.fechaAlta);
    const recargo=1+(STATE.config.recargoHorasExtras/100);const valHE=(salDiario/8)*recargo;
    const incMes=STATE.incidencias.filter(i=>i.empleadoId===e.id&&i.periodo===periodoKey);
    const incLabel=incMes.map(i=>i.tipo).join(', ')||'—';
    let diasPagados=l.diasTrabajados;
    incMes.filter(i=>i.tipo==='Vacaciones').forEach(v=>{diasPagados+=STATE.config.diasPagadosPeriodo-parseInt(v.diasAfectados||0)});
    const total=(salDiario*diasPagados)+bon+(l.horasExtras*valHE);l.totalDevengado=total;
    html+=`<tr>
      <td><b>${e.nombres} ${e.apellidos}</b></td>
      <td><span class="chip">${e.departamento}</span></td>
      <td>${jornC}d</td><td>${fmtMoney(salBase)}</td><td>${fmtMoney(salDiario)}</td>
      <td>${bPct?fmtMoney(bon)+'<small>('+bPct+'%)</small>':'—'}</td>
      <td>${!isReadOnly&&canEdit?`<input type="number" id="dt-${e.id}" value="${l.diasTrabajados}" min="0" max="${jornC}" onchange="updateNominaLine('${nomina.id}','${e.id}')">`:l.diasTrabajados}</td>
      <td>${!isReadOnly&&canEdit?`<input type="number" id="he-${e.id}" value="${l.horasExtras||0}" min="0" onchange="updateNominaLine('${nomina.id}','${e.id}')">`:l.horasExtras||0}</td>
      <td>${fmtMoney(valHE)}</td><td><small>${incLabel}</small></td>
      <td id="tot-${e.id}"><b>${fmtMoney(total)}</b></td>
    </tr>`;
  });

  const totalG=nomina.lineas.reduce((s,l)=>s+(l.totalDevengado||0),0);nomina.totalDevengado=totalG;saveState();
  html+=`<tr class="nomina-total-row"><td colspan="10" class="text-right"><b>TOTAL GENERAL:</b></td><td id="nom-total-general"><b>${fmtMoney(totalG)}</b></td></tr>`;
  html+=`</tbody></table></div>`;
  if(canEdit&&!isReadOnly){
    html+=`<div class="card-footer" style="display:flex;gap:10px;justify-content:flex-end">
      ${nomina.estado==='borrador'?`<button class="btn btn-gold" onclick="calcularNomina('${nomina.id}')">🧮 Calcular</button><button class="btn btn-primary" onclick="solicitarAprobacion('${nomina.id}')">📤 Solicitar Aprobación</button>`:''}
      ${nomina.estado==='pendiente'&&currentRole==='admin'?`<button class="btn btn-success" onclick="aprobarNomina('${nomina.id}')">✅ Aprobar Nómina</button>`:''}
    </div>`;
  }
  html+=`</div>`;
  document.getElementById('nomina-content').innerHTML=html;
}

function updateNominaLine(nomId,empId){
  const nomina=STATE.nominas.find(n=>n.id===nomId);if(!nomina)return;
  const linea=nomina.lineas.find(l=>l.empleadoId===empId);const e=STATE.empleados.find(x=>x.id===empId);if(!linea||!e)return;
  const dtEl=document.getElementById('dt-'+empId);const heEl=document.getElementById('he-'+empId);
  if(dtEl)linea.diasTrabajados=parseFloat(dtEl.value)||0;if(heEl)linea.horasExtras=parseFloat(heEl.value)||0;
  const salBase=e.salarioBase||0;const jornC=e.jornada||24;const salDiario=salBase/jornC;
  const bon=calcBonificacion(salBase,e.fechaAlta);const recargo=1+(STATE.config.recargoHorasExtras/100);const valHE=(salDiario/8)*recargo;
  const incMes=STATE.incidencias.filter(i=>i.empleadoId===empId&&i.periodo===nomina.periodo);
  let diasPagados=linea.diasTrabajados;
  incMes.filter(i=>i.tipo==='Vacaciones').forEach(v=>{diasPagados+=STATE.config.diasPagadosPeriodo-parseInt(v.diasAfectados||0)});
  linea.totalDevengado=(salDiario*diasPagados)+bon+(linea.horasExtras*valHE);saveState();
  const totEl=document.getElementById('tot-'+empId);if(totEl)totEl.innerHTML=`<b>${fmtMoney(linea.totalDevengado)}</b>`;
  const tg=nomina.lineas.reduce((s,l)=>s+(l.totalDevengado||0),0);nomina.totalDevengado=tg;
  const tgEl=document.getElementById('nom-total-general');if(tgEl)tgEl.innerHTML=`<b>${fmtMoney(tg)}</b>`;saveState();
}

function calcularNomina(nomId){const nomina=STATE.nominas.find(n=>n.id===nomId);if(!nomina)return;nomina.lineas.forEach(l=>updateNominaLine(nomId,l.empleadoId));showToast('Nómina calculada','success')}

function solicitarAprobacion(nomId){
  const n=STATE.nominas.find(x=>x.id===nomId);if(!n)return;
  confirmAction('¿Enviar nómina a revisión de Administración?',function(){n.estado='pendiente';saveState();addAuditLog('NOMINA_PENDIENTE',`Nómina ${n.mesNombre} ${n.ano} enviada a aprobación`);showToast('Nómina enviada','info');cargarNomina()});
}

function aprobarNomina(nomId){
  const n=STATE.nominas.find(x=>x.id===nomId);if(!n)return;
  confirmAction('¿Aprobar y cerrar esta nómina?',function(){n.estado='aprobada';n.fechaAprobacion=new Date().toISOString();saveState();addAuditLog('NOMINA_APROBADA',`Nómina ${n.mesNombre} ${n.ano} aprobada. Total: ${fmtMoney(n.totalDevengado)}`);showToast('Nómina aprobada','success');renderHistoricoNominas()});
}

function reabrirNomina(nomId){

function exportNomina(nomId){

function exportNominaActual(){
  const mes=parseInt(document.getElementById('nom-mes')?.value||new Date().getMonth()+1);
  const ano=parseInt(document.getElementById('nom-ano')?.value||new Date().getFullYear());
  const n=STATE.nominas.find(x=>x.periodo===`${ano}-${String(mes).padStart(2,'0')}`);

function renderIncidencias(container){
  const canAdd=currentRole==='contabilidad'||currentRole==='admin';
  document.getElementById('topbar-actions').innerHTML=canAdd?`<button class="btn btn-primary btn-sm" onclick="openModalIncidencia()">➕ Nueva Incidencia</button>`:'';
  container.innerHTML=`<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Empleado</th><th>Período</th><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Días</th><th>Impacto</th>${currentRole==='admin'?'<th>Eliminar</th>':''}</tr></thead>
    <tbody>${STATE.incidencias.length?STATE.incidencias.slice().reverse().map(i=>{
      const e=STATE.empleados.find(x=>x.id===i.empleadoId);
      const imp=i.tipo==='Permiso no retribuido'||i.tipo==='Ausencia injustificada'?'⬇️ Descuenta':'ℹ️ Sin descuento';
      return`<tr><td>${e?`${e.nombres} ${e.apellidos}`:'—'}</td><td>${i.periodo||'—'}</td>
      <td><span class="badge badge-info">${i.tipo}</span></td>
      <td>${fmtDate(i.fechaInicio)}</td><td>${fmtDate(i.fechaFin)}</td>
      <td><b>${i.diasAfectados}</b></td><td><small>${imp}</small></td>
      ${currentRole==='admin'?`<td><button class="btn btn-danger btn-xs" onclick="eliminarIncidencia('${i.id}')">🗑️</button></td>`:''}</tr>`;
    }).join(''):`<tr><td colspan="8" class="text-center text-muted" style="padding:40px">Sin incidencias</td></tr>`}
    </tbody>
  </table></div></div>`;
}

function openModalIncidencia(){
  const activos=getEmpleadosActivos();
  const tipos=['Baja médica','Permiso retribuido','Permiso no retribuido','Ausencia injustificada','Vacaciones'];
  openModal('📅 Registrar Incidencia',
    `<div class="form-grid">
      <div class="form-group full"><label class="field-label required">Empleado</label><select id="inc-emp"><option value="">Seleccione...</option>${activos.map(e=>`<option value="${e.id}">${e.nombres} ${e.apellidos}</option>`).join('')}</select></div>
      <div class="form-group"><label class="field-label required">Tipo</label><select id="inc-tipo" onchange="updateImpactoInfo()">${tipos.map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="form-group"><label class="field-label required" data-tip="Mes al que se imputa esta incidencia">Período (Año-Mes)</label><input type="month" id="inc-periodo" value="${new Date().toISOString().slice(0,7)}"></div>
      <div class="form-group"><label class="field-label required">Fecha Inicio</label><input type="date" id="inc-inicio" onchange="calcDiasInc()"></div>
      <div class="form-group"><label class="field-label required">Fecha Fin</label><input type="date" id="inc-fin" onchange="calcDiasInc()"></div>
      <div class="form-group"><label class="field-label" data-tip="Calculado automáticamente">Días Afectados</label><input type="number" id="inc-dias" readonly></div>
      <div class="form-group full" id="inc-impacto-info"><div class="input-hint">ℹ️ Seleccione tipo</div></div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarIncidencia()">Guardar</button>`);
  setTimeout(()=>updateImpactoInfo(),100);
}

function updateImpactoInfo(){
  const tipo=document.getElementById('inc-tipo')?.value;
  const info={'Baja médica':'Sin descuento en días trabajados','Permiso retribuido':'Sin descuento en días trabajados','Permiso no retribuido':'Descuenta días de nómina','Ausencia injustificada':'Descuenta días de nómina','Vacaciones':'Suma 15 días pagados por cada 7 días de descanso'};
  const div=document.getElementById('inc-impacto-info');
  if(div&&tipo)div.innerHTML=`<div class="input-hint">ℹ️ ${info[tipo]||''}</div>`;
}

function calcDiasInc(){
  const i=document.getElementById('inc-inicio')?.value;const f=document.getElementById('inc-fin')?.value;
  const d=document.getElementById('inc-dias');if(!i||!f||!d)return;
  const diff=(new Date(f)-new Date(i))/(1000*60*60*24)+1;d.value=diff>0?diff:0;
}

function guardarIncidencia(){
  const empId=document.getElementById('inc-emp').value;const tipo=document.getElementById('inc-tipo').value;
  const periodo=document.getElementById('inc-periodo').value;const fechaInicio=document.getElementById('inc-inicio').value;
  const fechaFin=document.getElementById('inc-fin').value;const diasAfectados=parseInt(document.getElementById('inc-dias').value)||0;
  if(!empId||!fechaInicio||!fechaFin||!periodo){showToast('Complete todos los campos','warning');return}
  if(diasAfectados<=0){showToast('Las fechas deben generar al menos 1 día','warning');return}
  const inc={id:'I'+uid(),empleadoId:empId,tipo,periodo,fechaInicio,fechaFin,diasAfectados};
  if(tipo==='Permiso no retribuido'||tipo==='Ausencia injustificada'){
    const nomina=STATE.nominas.find(n=>n.periodo===periodo);
    if(nomina){const linea=nomina.lineas.find(l=>l.empleadoId===empId);if(linea)linea.diasTrabajados=Math.max(0,linea.diasTrabajados-diasAfectados)}
  }
  if(tipo==='Vacaciones'){
    let ctrl=STATE.vacacionesControl.find(v=>v.empleadoId===empId&&v.ano===new Date(fechaInicio).getFullYear());
    if(!ctrl){ctrl={empleadoId:empId,ano:new Date(fechaInicio).getFullYear(),diasTomados:0};STATE.vacacionesControl.push(ctrl)}
    ctrl.diasTomados+=diasAfectados;
  }
  STATE.incidencias.push(inc);saveState();
  pushToSheets('incidencias','insertar', inc);
  const emp=STATE.empleados.find(e=>e.id===empId);
  addAuditLog('INCIDENCIA',`Incidencia (${tipo}) para ${emp.nombres} ${emp.apellidos}: ${diasAfectados} días`);
  showToast('Incidencia registrada','success');closeModal();renderIncidencias(document.getElementById('app-content'));
}

function eliminarIncidencia(id){
  confirmAction('¿Eliminar esta incidencia?',function(){
    const idx=STATE.incidencias.findIndex(i=>i.id===id);
    if(idx>-1){STATE.incidencias.splice(idx,1);saveState();addAuditLog('ELIMINAR_INCIDENCIA','Incidencia eliminada por Admin');showToast('Eliminada','info');renderIncidencias(document.getElementById('app-content'))}
  });
}

function renderVacaciones(container){
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-secondary btn-sm" onclick="exportVacaciones()">⬇️ Excel</button>`;
  const activos=getEmpleadosActivos();const anoActual=new Date().getFullYear();
  container.innerHTML=`<div class="card">
    <div class="card-header"><h3>🌴 Submayor de Vacaciones ${anoActual}</h3>
      <span class="text-muted" style="font-size:13px">Derecho: ${STATE.config.diasVacaciones}d/año | Pagados/período: ${STATE.config.diasPagadosPeriodo}d</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Empleado</th><th>Dpto</th><th>Derecho Anual</th><th>Días Tomados</th><th>Días Pendientes</th><th>Valor Pendiente</th><th>Progreso</th></tr></thead>
      <tbody>${activos.map(e=>{
        const ctrl=STATE.vacacionesControl.find(v=>v.empleadoId===e.id&&v.ano===anoActual);
        const tomados=ctrl?.diasTomados||0;const pendientes=Math.max(0,STATE.config.diasVacaciones-tomados);
        const salDiario=(e.salarioBase||0)/(e.jornada||24);const valPend=salDiario*pendientes;
        const pct=Math.min(100,(tomados/STATE.config.diasVacaciones)*100);
        return`<tr><td><b>${e.nombres} ${e.apellidos}</b></td><td>${e.departamento}</td>
        <td>${STATE.config.diasVacaciones}d</td><td>${tomados}</td>
        <td><b style="color:var(--burgundy)">${pendientes}</b></td><td>${fmtMoney(valPend)}</td>
        <td><div class="progress-bar-wrap" style="min-width:80px"><div class="progress-bar" style="width:${pct}%"></div></div><small>${pct.toFixed(0)}%</small></td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

function exportVacaciones(){
  const activos=getEmpleadosActivos();const anoActual=new Date().getFullYear();
  const data=activos.map(e=>{
    const ctrl=STATE.vacacionesControl.find(v=>v.empleadoId===e.id&&v.ano===anoActual);
    const tomados=ctrl?.diasTomados||0;const pendientes=Math.max(0,STATE.config.diasVacaciones-tomados);
    return{Empleado:`${e.nombres} ${e.apellidos}`,Departamento:e.departamento,'Derecho Anual':STATE.config.diasVacaciones,'Días Tomados':tomados,'Días Pendientes':pendientes,'Valor Pendiente':((e.salarioBase||0)/(e.jornada||24))*pendientes};
  });
  exportToExcel(data,`Vacaciones_${anoActual}`);showToast('Exportado','success');
}

function togglePinVis(id,btn){const inp=document.getElementById(id);if(inp.type==='password'){inp.type='text';btn.textContent='🙈'}else{inp.type='password';btn.textContent='👁️'}}

function guardarConfiguracion(){
  const r=document.getElementById('cfg-pin-rrhh').value.trim();const j=document.getElementById('cfg-pin-jur').value.trim();const c=document.getElementById('cfg-pin-cont').value.trim();
  if([r,j,c].some(p=>!/^\d{4}$/.test(p))){showToast('Todos los PINs deben tener exactamente 4 dígitos','error');return}
  if([r,j,c].includes(STATE.config.adminPin)){showToast('Un PIN no puede ser igual al PIN de Administración','error');return}
  STATE.config.pins.rrhh=r;STATE.config.pins.juridico=j;STATE.config.pins.contabilidad=c;
  STATE.config.bonificacion.anios1=parseInt(document.getElementById('cfg-bon-anos1').value)||5;
  STATE.config.bonificacion.nivel1=parseInt(document.getElementById('cfg-bon-pct1').value)||5;
  STATE.config.bonificacion.anios2=parseInt(document.getElementById('cfg-bon-anos2').value)||10;
  STATE.config.bonificacion.nivel2=parseInt(document.getElementById('cfg-bon-pct2').value)||10;
  STATE.config.recargoHorasExtras=parseFloat(document.getElementById('cfg-recargo').value)||50;
  STATE.config.diasVacaciones=parseInt(document.getElementById('cfg-vac-dias').value)||14;
  STATE.config.diasPagadosPeriodo=parseInt(document.getElementById('cfg-vac-pag').value)||15;
  saveState();
  // Sincronizar config con Sheets
  const cfgSheets = {
    pinRrhh: STATE.config.pins.rrhh,
    pinJuridico: STATE.config.pins.juridico,
    pinContabilidad: STATE.config.pins.contabilidad,
    bonAnios1: STATE.config.bonificacion.anios1,
    bonNivel1: STATE.config.bonificacion.nivel1,
    bonAnios2: STATE.config.bonificacion.anios2,
    bonNivel2: STATE.config.bonificacion.nivel2,
    recargoHE: STATE.config.recargoHorasExtras,
    diasVacaciones: STATE.config.diasVacaciones,
    diasPagados: STATE.config.diasPagadosPeriodo
  };
  apiCall({ accion: 'guardarConfig', tabla: 'config', valores: cfgSheets }).catch(e => console.warn('Config Sheets:', e));
  addAuditLog('CONFIG','Configuración actualizada por Admin');showToast('Configuración guardada','success');
}

// ══════════════════════════════════════════════════
// AUDITORÍA
// ══════════════════════════════════════════════════
function renderAuditoria(container){
  if(currentRole!=='admin'){container.innerHTML='<div class="empty-state"><div class="empty-icon">🔒</div><h4>Solo Administración</h4></div>';return}
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-secondary btn-sm" onclick="exportAuditoria()">⬇️ Exportar</button>`;
  container.innerHTML=`<div class="card">
    <div class="filters-bar"><input type="text" id="aud-q" placeholder="🔍 Buscar..." style="min-width:260px" oninput="filtrarAuditoria()"></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Fecha y Hora</th><th>Rol</th><th>Tipo</th><th>Detalle</th></tr></thead>
      <tbody id="aud-tbody">${renderAuditoriaRows(STATE.auditLog)}</tbody>
    </table></div>
  </div>`;
}

function renderAuditoriaRows(logs){
  if(!logs.length)return`<tr><td colspan="4" class="text-center text-muted" style="padding:40px">Sin registros</td></tr>`;
  return logs.slice(0,200).map(l=>`<tr><td><code style="font-size:12px">${new Date(l.fecha).toLocaleString('es-ES')}</code></td><td><span class="badge badge-info">${l.rol}</span></td><td><span class="chip">${l.tipo}</span></td><td>${l.detalle}</td></tr>`).join('');
}

function filtrarAuditoria(){
  const q=document.getElementById('aud-q').value.toLowerCase();
  const f=STATE.auditLog.filter(l=>l.tipo.toLowerCase().includes(q)||l.detalle.toLowerCase().includes(q)||l.rol.toLowerCase().includes(q));
  document.getElementById('aud-tbody').innerHTML=renderAuditoriaRows(f);
}

function exportAuditoria(){
  exportToExcel(STATE.auditLog.map(l=>({Fecha:new Date(l.fecha).toLocaleString('es-ES'),Rol:l.rol,Tipo:l.tipo,Detalle:l.detalle})),'AuditoriaLog_LaCatedral');
  showToast('Exportado','success');
}

// ══════════════════════════════════════════════════
// BACKUP
// ══════════════════════════════════════════════════
function renderBackup(container){
  if(currentRole!=='admin'){container.innerHTML='<div class="empty-state"><div class="empty-icon">🔒</div><h4>Solo Administración</h4></div>';return}
  container.innerHTML=`<div class="card" style="max-width:600px">
    <div class="card-header"><h3>💾 Copia de Seguridad</h3></div>
    <div class="card-body">
      <div class="stats-grid" style="margin-bottom:24px">
        <div class="stat-card"><div class="stat-value">${STATE.empleados.length}</div><div class="stat-label">Empleados</div></div>
        <div class="stat-card"><div class="stat-value">${STATE.nominas.length}</div><div class="stat-label">Nóminas</div></div>
        <div class="stat-card"><div class="stat-value">${STATE.sanciones.length}</div><div class="stat-label">Sanciones</div></div>
        <div class="stat-card"><div class="stat-value">${STATE.auditLog.length}</div><div class="stat-label">Logs</div></div>
      </div>
      <div class="divider"></div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div><h4 style="margin-bottom:8px;color:var(--burgundy)">⬇️ Exportar Copia de Seguridad</h4>
          <p class="text-muted">Descarga todos los datos en formato JSON.</p>
          <button class="btn btn-primary" style="margin-top:10px;width:auto" onclick="exportBackup()">💾 Descargar Backup</button></div>
        <div class="divider"></div>
        <div><h4 style="margin-bottom:8px;color:var(--burgundy)">⬆️ Restaurar desde Copia</h4>
          <p class="text-muted">⚠️ Esto reemplazará TODOS los datos actuales.</p>
          <div class="file-drop" style="margin-top:10px" onclick="document.getElementById('backup-file').click()">
            <div class="file-icon">📂</div><p>Seleccionar archivo .json de backup</p>
            <input type="file" id="backup-file" accept="application/json,.json" style="display:none" onchange="previewBackup(this)">
            <span id="backup-file-name" class="text-muted"></span>
          </div>
          <button class="btn btn-danger" style="margin-top:10px;width:auto" onclick="importBackup()">♻️ Restaurar Backup</button></div>
      </div>
    </div>
  </div>`;
}

function exportBackup(){
  const json=JSON.stringify(STATE,null,2);const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`LaCatedral_Backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
  addAuditLog('BACKUP','Copia de seguridad exportada');showToast('Backup descargado','success');
}

function previewBackup(input){const l=document.getElementById('backup-file-name');if(input.files[0])l.textContent='✅ '+input.files[0].name}

function importBackup(){
  const input=document.getElementById('backup-file');
  if(!input.files[0]){showToast('Seleccione un archivo de backup','warning');return}
  confirmAction('⚠️ ¿Restaurar backup? Se perderán los datos actuales.',function(){
    const r=new FileReader();
    r.onload=function(e){
      try{const data=JSON.parse(e.target.result);if(!data.empleados||!data.config)throw new Error('Formato inválido');STATE=data;saveState();addAuditLog('RESTORE','Datos restaurados desde backup');showToast('Backup restaurado','success');renderBackup(document.getElementById('app-content'))}
      catch(err){showToast('Error al leer el backup: '+err.message,'error')}
    };r.readAsText(input.files[0]);
  });
}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded',()=>{
  STATE=loadState();
  // Migrate old storage key if exists
  const old=localStorage.getItem('lacatedral_v1');
  if(old&&!localStorage.getItem(STORAGE_KEY)){
    try{const parsed=JSON.parse(old);STATE=parsed;saveState();showToast('Datos migrados de versión anterior','info',5000)}catch(e){}
  }
  document.getElementById('p0').focus();
  tempLicencias=[];tempFotoCarnet=null;
  // Verificar conexión al cargar
  apiCall({accion:'ping'}).then(()=>{DB_ONLINE=true;updateSyncBadge(true);}).catch(()=>{DB_ONLINE=false;updateSyncBadge(false);});
});
</script>
</body>
