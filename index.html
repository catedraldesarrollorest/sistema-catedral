<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Catedral — Sistema de Gestión Integral</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --burgundy:#6B1A1A;--burgundy-dark:#4A0E0E;--burgundy-light:#8B2E2E;
    --gold:#C9A84C;--gold-light:#E2C97E;--gold-pale:#F5EDD5;
    --cream:#FAF6EE;--cream-dark:#F0E8D5;
    --charcoal:#1C1C1E;--charcoal-mid:#2C2C2E;
    --text-dark:#1A1A1A;--text-mid:#4A4A4A;--text-light:#7A7A7A;
    --white:#FFFFFF;--border:#D5C9A8;--border-light:#E8DFC8;
    --success:#2D6A4F;--success-light:#D8F3DC;
    --warning:#B5642A;--warning-light:#FDEBD0;
    --danger:#8B1A1A;--danger-light:#FDDEDE;
    --info:#1B4D6E;--info-light:#D6EAF8;
    --shadow:0 4px 24px rgba(107,26,26,0.12);
    --shadow-sm:0 2px 8px rgba(0,0,0,0.08);
    --shadow-lg:0 8px 40px rgba(107,26,26,0.18);
    --radius:8px;--radius-lg:14px;--sidebar-w:260px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Crimson Pro',Georgia,serif;background:var(--cream);color:var(--text-dark);min-height:100vh;font-size:16px;line-height:1.6}

  /* LOGIN */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--burgundy-dark) 0%,var(--burgundy) 40%,var(--charcoal-mid) 100%);position:relative;overflow:hidden}
  #login-screen::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A84C' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");opacity:0.3}
  .login-card{background:var(--white);border-radius:var(--radius-lg);padding:52px 48px;width:420px;max-width:95vw;box-shadow:var(--shadow-lg);position:relative;z-index:1;animation:fadeUp 0.5s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .login-logo{text-align:center;margin-bottom:32px}
  .login-logo .crown{font-size:42px;margin-bottom:8px;display:block}
  .login-logo h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--burgundy);letter-spacing:1px}
  .login-logo p{color:var(--text-light);font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
  .login-divider{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px 0}
  .login-roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
  .role-btn{padding:14px 10px;border:2px solid var(--border);border-radius:var(--radius);background:var(--cream);cursor:pointer;text-align:center;transition:all 0.2s;font-family:'Crimson Pro',serif;font-size:14px;color:var(--text-mid)}
  .role-btn:hover,.role-btn.selected{border-color:var(--burgundy);background:var(--burgundy);color:var(--white)}
  .role-btn .role-icon{font-size:22px;display:block;margin-bottom:4px}
  .role-btn .role-name{font-weight:600;font-size:13px}
  .pin-group{margin-bottom:20px}
  .pin-group label{display:block;font-size:13px;color:var(--text-mid);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:16px}
  .pin-dot{width:48px;height:56px;border:2px solid var(--border);border-radius:var(--radius);font-size:22px;text-align:center;font-family:'JetBrains Mono',monospace;background:var(--cream);color:var(--text-dark);outline:none;transition:border-color 0.2s}
  .pin-dot:focus{border-color:var(--burgundy);background:var(--white)}
  .btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:12px 24px;border:none;border-radius:var(--radius);font-family:'Crimson Pro',serif;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.2s;text-decoration:none}
  .btn-primary{background:var(--burgundy);color:var(--white);width:100%}
  .btn-primary:hover{background:var(--burgundy-dark);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
  .btn-secondary{background:var(--cream-dark);color:var(--text-dark);border:1px solid var(--border)}
  .btn-secondary:hover{background:var(--border)}
  .btn-gold{background:var(--gold);color:var(--charcoal)}
  .btn-gold:hover{background:var(--gold-light)}
  .btn-danger{background:var(--danger);color:var(--white)}
  .btn-danger:hover{background:var(--burgundy-dark)}
  .btn-success{background:var(--success);color:var(--white)}
  .btn-success:hover{opacity:0.9}
  .btn-info{background:var(--info);color:var(--white)}
  .btn-sm{padding:6px 14px;font-size:13px}
  .btn-xs{padding:4px 10px;font-size:12px}
  .login-error{background:var(--danger-light);color:var(--danger);border:1px solid #f5c6c6;border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:14px;text-align:center;display:none}

  /* APP */
  #app{display:flex;min-height:100vh}
  #sidebar{width:var(--sidebar-w);min-height:100vh;background:linear-gradient(180deg,var(--burgundy-dark) 0%,var(--charcoal) 100%);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;box-shadow:4px 0 20px rgba(0,0,0,0.25)}
  .sidebar-header{padding:28px 20px 20px;border-bottom:1px solid rgba(201,168,76,0.2)}
  .sidebar-logo{color:var(--gold);font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:0.5px}
  .sidebar-logo span{display:block;color:rgba(255,255,255,0.5);font-size:11px;text-transform:uppercase;letter-spacing:2px;font-family:'Crimson Pro',serif;margin-top:2px}
  .sidebar-role-badge{margin:12px 0 0;display:inline-flex;align-items:center;gap:6px;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);border-radius:20px;padding:4px 12px;color:var(--gold-light);font-size:12px;font-weight:600}
  .sidebar-nav{flex:1;padding:16px 0;overflow-y:auto}
  .nav-section{padding:0 12px;margin-bottom:4px}
  .nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.3);padding:12px 8px 6px;font-family:'Crimson Pro',serif}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:rgba(255,255,255,0.7);font-size:14px;cursor:pointer;transition:all 0.2s;margin-bottom:2px}
  .nav-item:hover{background:rgba(255,255,255,0.08);color:var(--white)}
  .nav-item.active{background:rgba(201,168,76,0.2);color:var(--gold-light);border-left:3px solid var(--gold);padding-left:9px}
  .nav-item .nav-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0}
  .sidebar-footer{padding:16px;border-top:1px solid rgba(255,255,255,0.08)}
  .sidebar-footer .btn{width:100%;font-size:13px;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.12)}
  .sidebar-footer .btn:hover{background:rgba(255,255,255,0.15);color:var(--white)}
  #main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
  .topbar{height:64px;background:var(--white);border-bottom:1px solid var(--border-light);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm)}
  .topbar h2{font-family:'Playfair Display',serif;font-size:20px;color:var(--burgundy);font-weight:700;flex:1}
  .topbar-actions{display:flex;align-items:center;gap:10px}
  .content{padding:28px;flex:1}

  /* CARDS */
  .card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border-light);box-shadow:var(--shadow-sm);overflow:hidden}
  .card-header{padding:18px 24px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:12px}
  .card-header h3{font-family:'Playfair Display',serif;font-size:17px;color:var(--burgundy);font-weight:700;flex:1}
  .card-body{padding:24px}
  .card-footer{padding:16px 24px;border-top:1px solid var(--border-light);background:var(--cream)}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
  .stat-card{background:var(--white);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border-light);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold)}
  .stat-card.burgundy::after{background:var(--burgundy)}
  .stat-card.success::after{background:var(--success)}
  .stat-card.warning::after{background:var(--warning)}
  .stat-value{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--text-dark)}
  .stat-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-light);margin-top:4px}
  .stat-icon{position:absolute;right:16px;top:16px;font-size:28px;opacity:0.15}

  /* FORMS */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group.full{grid-column:1/-1}
  label.field-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-mid)}
  .required::after{content:' *';color:var(--burgundy)}
  input[type="text"],input[type="number"],input[type="date"],input[type="email"],input[type="tel"],input[type="password"],input[type="month"],select,textarea{padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:'Crimson Pro',serif;font-size:15px;color:var(--text-dark);background:var(--white);outline:none;transition:border-color 0.2s,box-shadow 0.2s}
  input:focus,select:focus,textarea:focus{border-color:var(--burgundy);box-shadow:0 0 0 3px rgba(107,26,26,0.08)}
  input:read-only{background:var(--cream);color:var(--text-light)}
  textarea{resize:vertical;min-height:80px}
  .input-hint{font-size:12px;color:var(--text-light);margin-top:2px}
  .form-section-title{grid-column:1/-1;font-family:'Playfair Display',serif;font-size:15px;color:var(--burgundy);font-weight:600;padding:8px 0 4px;border-bottom:1px solid var(--border-light);margin-bottom:4px}
  .form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}

  /* TABLES */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{background:var(--burgundy);color:var(--gold-light);padding:11px 14px;text-align:left;font-family:'Crimson Pro',serif;font-size:12px;text-transform:uppercase;letter-spacing:0.8px;font-weight:600;white-space:nowrap}
  tbody tr{border-bottom:1px solid var(--border-light);transition:background 0.15s}
  tbody tr:hover{background:var(--gold-pale)}
  tbody td{padding:10px 14px;vertical-align:middle;color:var(--text-dark)}
  tbody tr:last-child{border-bottom:none}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
  .badge-active{background:var(--success-light);color:var(--success)}
  .badge-inactive{background:var(--danger-light);color:var(--danger)}
  .badge-gold{background:rgba(201,168,76,0.15);color:var(--warning);border:1px solid rgba(201,168,76,0.4)}
  .badge-info{background:var(--info-light);color:var(--info)}
  .badge-warning{background:var(--warning-light);color:var(--warning)}
  .badge-draft{background:var(--cream-dark);color:var(--text-mid);border:1px solid var(--border)}
  .badge-pending{background:#FFF3CD;color:#856404}
  .badge-approved{background:var(--success-light);color:var(--success)}

  /* FILTERS */
  .filters-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px;background:var(--cream);border-bottom:1px solid var(--border-light)}
  .filter-group{display:flex;align-items:center;gap:6px}
  .filter-group label{font-size:12px;color:var(--text-light);white-space:nowrap}
  .filter-group select,.filter-group input{padding:7px 12px;font-size:13px;min-width:120px}
  .search-input{flex:1;min-width:200px}

  /* TABS */
  .tabs{display:flex;gap:0;border-bottom:2px solid var(--border-light);margin-bottom:24px;overflow-x:auto}
  .tab{padding:12px 20px;cursor:pointer;font-family:'Crimson Pro',serif;font-size:14px;font-weight:600;color:var(--text-light);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all 0.2s}
  .tab:hover{color:var(--burgundy)}
  .tab.active{color:var(--burgundy);border-bottom-color:var(--burgundy)}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(28,28,30,0.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .modal-overlay.open{display:flex;animation:fadeIn 0.2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp 0.25s ease}
  .modal.modal-sm{max-width:440px}
  .modal.modal-lg{max-width:960px}
  .modal.modal-xl{max-width:1100px}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-header{padding:20px 24px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--white);z-index:1}
  .modal-header h3{font-family:'Playfair Display',serif;font-size:18px;color:var(--burgundy);font-weight:700;flex:1}
  .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);padding:4px;line-height:1;transition:color 0.15s}
  .modal-close:hover{color:var(--text-dark)}
  .modal-body{padding:24px}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--border-light);display:flex;gap:10px;justify-content:flex-end}

  /* TOOLTIPS */
  [data-tip]{position:relative;cursor:help}
  [data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--charcoal);color:var(--white);padding:8px 12px;border-radius:6px;font-size:12px;white-space:normal;max-width:240px;pointer-events:none;opacity:0;transition:opacity 0.2s;z-index:999;box-shadow:var(--shadow);line-height:1.4;text-transform:none;letter-spacing:0;font-family:'Crimson Pro',serif;font-weight:400}
  [data-tip]:hover::after{opacity:1}

  /* TOAST */
  #toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
  .toast{padding:14px 18px;border-radius:var(--radius);font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;animation:slideIn 0.3s ease;min-width:280px;font-family:'Crimson Pro',serif}
  @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
  .toast-success{background:var(--success);color:var(--white)}
  .toast-error{background:var(--danger);color:var(--white)}
  .toast-warning{background:var(--warning);color:var(--white)}
  .toast-info{background:var(--info);color:var(--white)}

  /* MISC */
  .divider{height:1px;background:var(--border-light);margin:20px 0}
  .text-muted{color:var(--text-light);font-size:13px}
  .text-gold{color:var(--gold)}
  .text-burgundy{color:var(--burgundy)}
  .text-right{text-align:right}
  .text-center{text-align:center}
  .fw-bold{font-weight:700}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-light)}
  .empty-state .empty-icon{font-size:52px;margin-bottom:12px;opacity:0.4}
  .empty-state h4{font-family:'Playfair Display',serif;font-size:18px;color:var(--text-mid);margin-bottom:6px}
  .history-list{display:flex;flex-direction:column;gap:10px}
  .history-item{padding:12px 16px;background:var(--cream);border-radius:var(--radius);border-left:3px solid var(--gold);font-size:13px}
  .history-item .hi-date{color:var(--text-light);font-size:12px}
  .progress-bar-wrap{background:var(--border-light);border-radius:4px;height:6px;overflow:hidden}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--burgundy),var(--gold));border-radius:4px;transition:width 0.3s}
  .chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;background:var(--cream-dark);color:var(--text-mid);border:1px solid var(--border)}
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
  .chart-card{background:var(--white);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border-light)}
  .chart-card h4{font-family:'Playfair Display',serif;font-size:15px;color:var(--burgundy);margin-bottom:16px}
  .nomina-table{font-size:13px}
  .nomina-table th{padding:9px 10px;font-size:11px}
  .nomina-table td{padding:8px 10px}
  .nomina-table input[type="number"]{width:70px;padding:5px 8px;font-size:13px}
  .nomina-total-row td{background:var(--gold-pale);font-weight:700}
  .file-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:28px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--cream)}
  .file-drop:hover{border-color:var(--burgundy);background:var(--gold-pale)}
  .file-drop .file-icon{font-size:32px;margin-bottom:8px}
  .file-drop p{color:var(--text-light);font-size:14px}
  .file-drop-sm{padding:14px;display:flex;align-items:center;gap:10px;text-align:left}
  .file-drop-sm .file-icon{font-size:22px;margin-bottom:0}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--burgundy-light)}
  .section{display:none}
  .section.active{display:block}
  #login-screen.hidden{display:none}
  #app.hidden{display:none}
  .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
  .tag-directo{background:rgba(45,106,79,0.12);color:var(--success)}
  .tag-indirecto{background:rgba(181,100,42,0.12);color:var(--warning)}

  /* EXPEDIENTE TIMELINE */
  .timeline{position:relative;padding-left:28px}
  .timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--border-light)}
  .timeline-item{position:relative;margin-bottom:20px}
  .timeline-dot{position:absolute;left:-22px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--white);box-shadow:0 0 0 2px var(--gold)}
  .timeline-dot.red{background:var(--danger);box-shadow:0 0 0 2px var(--danger)}
  .timeline-dot.green{background:var(--success);box-shadow:0 0 0 2px var(--success)}
  .timeline-dot.blue{background:var(--info);box-shadow:0 0 0 2px var(--info)}
  .timeline-dot.purple{background:#7B2D8B;box-shadow:0 0 0 2px #7B2D8B}
  .timeline-content{background:var(--cream);border-radius:var(--radius);padding:12px 16px;border:1px solid var(--border-light)}
  .timeline-content .tl-date{font-size:12px;color:var(--text-light);margin-bottom:4px}
  .timeline-content .tl-title{font-weight:700;color:var(--text-dark);font-size:14px}
  .timeline-content .tl-desc{font-size:13px;color:var(--text-mid);margin-top:4px}

  /* FOTO CARNET */
  .foto-carnet-preview{width:120px;height:150px;object-fit:cover;border-radius:var(--radius);border:2px solid var(--border);display:block}
  .foto-carnet-placeholder{width:120px;height:150px;background:var(--cream-dark);border-radius:var(--radius);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--text-light);font-size:12px;cursor:pointer}

  /* ALERT SEMAFORO */
  .alert-semaforo{border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px}
  .alert-semaforo-header{padding:14px 20px;font-family:'Playfair Display',serif;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
  .alert-semaforo-body{padding:0 20px 16px}
  .alert-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.15);font-size:14px}
  .alert-row:last-child{border-bottom:none}
  .semaforo-red{background:linear-gradient(135deg,#8B1A1A,#C0392B)}

  .semaforo-yellow{background:linear-gradient(135deg,#B5642A,#E67E22)}

  /* CONTRACT PRINT */

    #sidebar,#topbar,.topbar,.topbar-actions,.btn,nav,#toast-container{display:none!important}
    #main{margin-left:0!important}
    .contract-print-area{display:block!important}

  }
  .contract-print-area{font-family:'Times New Roman',serif;font-size:13px;line-height:1.8;color:#000;padding:40px;max-width:800px;margin:0 auto}
  .contract-print-area h1{text-align:center;font-size:16px;font-weight:bold;margin-bottom:24px;text-transform:uppercase}
  .contract-print-area p{margin-bottom:12px;text-align:justify}

  .contract-print-area .sign-area{display:flex;justify-content:space-between;margin-top:60px}
  .contract-print-area .sign-line{text-align:center;width:45%}
  .contract-print-area .sign-line div{border-top:1px solid #000;padding-top:8px;margin-top:40px}
  .contract-print-area ul{padding-left:24px;margin-bottom:12px}
  .contract-print-area ul li{margin-bottom:6px}
  .contract-print-area .contract-field{font-weight:bold;text-decoration:underline}

  /* IMAGE PREVIEW GRID */
  .img-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .img-thumb{position:relative;width:80px;height:80px}
  .img-thumb img{width:80px;height:80px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border)}
  .img-thumb .img-remove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;background:var(--danger);color:white;border-radius:50%;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}

  /* CERT MEDICO STATUS */
  .cert-ok{color:var(--success);font-weight:600}
  .cert-warn{color:var(--warning);font-weight:600}
  .cert-exp{color:var(--danger);font-weight:600}

  @media(max-width:768px){
    :root{--sidebar-w:0px}
    #sidebar{display:none}
    #main{margin-left:0}
    .content{padding:16px}
    .form-grid{grid-template-columns:1fr}
    .chart-grid{grid-template-columns:1fr}
    .stats-grid{grid-template-columns:1fr 1fr}
  }

  /* SYNC INDICATOR */
  .sync-indicator{position:fixed;bottom:16px;right:16px;z-index:9998;padding:8px 16px;border-radius:20px;font-size:13px;font-family:'Crimson Pro',serif;display:none;align-items:center;gap:8px;box-shadow:var(--shadow);transition:all 0.3s}
  .sync-syncing{background:var(--info);color:white}
  .sync-ok{background:var(--success);color:white}
  .sync-offline{background:var(--warning);color:white}
  .sync-status-bar{font-size:11px;color:rgba(255,255,255,0.5);padding:4px 8px;display:block;text-align:center}

</style>
</head>
<body>
<div id="toast-container"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <span class="crown">⚜️</span>
      <h1>La Catedral</h1>
      <p>Sistema de Gestión Integral</p>
    </div>
    <div class="login-divider"></div>
    <p style="text-align:center;font-size:14px;color:var(--text-light);margin-bottom:16px">Seleccione su departamento e ingrese el PIN</p>
    <div class="login-roles">
      <button class="role-btn" data-role="admin" onclick="selectRole('admin',this)"><span class="role-icon">👑</span><span class="role-name">Administración</span></button>
      <button class="role-btn" data-role="rrhh" onclick="selectRole('rrhh',this)"><span class="role-icon">👥</span><span class="role-name">RRHH</span></button>
      <button class="role-btn" data-role="juridico" onclick="selectRole('juridico',this)"><span class="role-icon">⚖️</span><span class="role-name">Jurídico</span></button>
      <button class="role-btn" data-role="contabilidad" onclick="selectRole('contabilidad',this)"><span class="role-icon">📊</span><span class="role-name">Contabilidad</span></button>

    <div class="pin-group">
      <label class="field-label">PIN de acceso (4 dígitos)</label>
      <div class="pin-dots">
        <input type="password" class="pin-dot" maxlength="1" id="p0" oninput="pinNav(0)" onkeydown="pinBack(event,0)">
        <input type="password" class="pin-dot" maxlength="1" id="p1" oninput="pinNav(1)" onkeydown="pinBack(event,1)">
        <input type="password" class="pin-dot" maxlength="1" id="p2" oninput="pinNav(2)" onkeydown="pinBack(event,2)">
        <input type="password" class="pin-dot" maxlength="1" id="p3" oninput="pinNav(3)" onkeydown="pinBack(event,3)">
      </div>
    </div>
    <div class="login-error" id="login-error">PIN incorrecto. Intente de nuevo.</div>
    <button class="btn btn-primary" onclick="doLogin()">🔓 Acceder</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <nav id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">⚜️ La Catedral<span>Gestión Integral</span></div>
      <div class="sidebar-role-badge" id="role-badge">—</div>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-footer"><span class="sync-status-bar" id="sync-status-badge">⏳ Verificando...</span><button class="btn" onclick="doLogout()">🚪 Cerrar sesión</button><button class="btn" style="margin-top:6px;font-size:11px" onclick="manualSync()">🔄 Sincronizar</button></div>
  </nav>
  <div id="main">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="app-content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer" style="display:none"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════
// STATE & STORAGE
// ══════════════════════════════════════════════════
const STORAGE_KEY = 'lacatedral_v2';
const API_URL = 'https://script.google.com/macros/s/AKfycbyHG3s_SPTFgkcK3I573exJDbHT6jShDI3GOtCcoSrW2PafQ0lCdT9IPf_1MiC79Tk/exec';
let DB_ONLINE = false;
let DB_PENDING_OPS = [];

function loadState() {
  try { const r = localStorage.getItem(STORAGE_KEY); if(r) return JSON.parse(r); } catch(e){}
  return getDefaultState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch(e) { showToast('Error al guardar: '+e.message,'error'); }
}

// ── DB LAYER ────────────────────────────────────────────────────
function showSyncIndicator(msg, type) {
  let el = document.getElementById('sync-indicator');
  if (!el) return;
  el.textContent = msg; el.className = 'sync-indicator sync-' + type; el.style.display = 'flex';
  if (type === 'ok') setTimeout(() => { el.style.display = 'none'; }, 3000);
}
function updateSyncBadge(online) {
  const b = document.getElementById('sync-status-badge');
  if (!b) return;
  b.textContent = online ? '🟢 Online — Sheets' : '🔴 Offline — Solo local';
  b.style.color = online ? '#81C784' : '#FF8A80';
}
async function apiCall(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json.status === 'error') throw new Error(json.message);
  return json;
}
async function dbLeer(tabla) {
  const r = await apiCall({ accion: 'leer', tabla }); return r.data || [];
}
async function dbInsertar(tabla, valores) {
  return await apiCall({ accion: 'insertar', tabla, valores });
}
async function dbActualizar(tabla, id, valores) {
  return await apiCall({ accion: 'actualizar', tabla, id, valores });
}
async function dbEliminar(tabla, id) {
  return await apiCall({ accion: 'eliminar', tabla, id });
}
async function pushToSheets(tabla, accion, valores, id) {
  try {
    if (accion==='insertar') await dbInsertar(tabla, valores);
    else if (accion==='actualizar') await dbActualizar(tabla, id, valores);
    else if (accion==='eliminar') await dbEliminar(tabla, id);
    DB_ONLINE = true; updateSyncBadge(true);
    showSyncIndicator('✅ Guardado en Sheets', 'ok');
  } catch(err) {
    DB_ONLINE = false; updateSyncBadge(false);
    DB_PENDING_OPS.push({ tabla, accion, valores, id });
    showSyncIndicator('⚠️ Guardado local (Sheets no disponible)', 'offline');
  }
}
async function manualSync() {
  showSyncIndicator('⏳ Sincronizando...', 'syncing');
  try {
    await sincronizarDesdeSheets();
    await flushPendingOps();
  } catch(e) { showSyncIndicator('❌ Error de conexión', 'offline'); }
}
async function flushPendingOps() {
  if (DB_PENDING_OPS.length === 0) return;
  const ops = [...DB_PENDING_OPS]; DB_PENDING_OPS = [];
  for (const op of ops) {
    try { await pushToSheets(op.tabla, op.accion, op.valores, op.id); }
    catch(e) { DB_PENDING_OPS.push(op); }
  }
  if (DB_PENDING_OPS.length === 0) showToast('Operaciones pendientes sincronizadas ✅', 'success');
}
async function sincronizarDesdeSheets() {
  showSyncIndicator('⏳ Conectando con Sheets...', 'syncing');
  try {
    await apiCall({ accion: 'ping' });
    const tablas = ['empleados','traslados','bajas','sanciones','nominas','nominaLineas','incidencias','vacacionesControl','historialSalarial'];
    const resultados = await Promise.all(tablas.map(t => dbLeer(t).catch(() => null)));
    tablas.forEach((tabla, i) => {
      if (!resultados[i] || resultados[i].length === 0) return;
      const data = resultados[i];
      if (tabla === 'empleados') {
        STATE.empleados = data.map(r => ({ ...r, jornada: parseInt(r.jornada)||24, salarioBase: r.salarioBase ? parseFloat(r.salarioBase) : null, activo: String(r.activo)==='true'||r.activo===true }));
      } else if (tabla === 'nominas') {
        const existLineas = STATE.nominas.reduce((acc,n)=>{acc[n.id]=n.lineas||[];return acc},{});
        STATE.nominas = data.map(r => ({ ...r, mes:parseInt(r.mes)||1, ano:parseInt(r.ano)||new Date().getFullYear(), totalDevengado:parseFloat(r.totalDevengado)||0, lineas: existLineas[r.id]||[] }));
      } else if (tabla === 'nominaLineas') {
        data.forEach(linea => {
          const nom = STATE.nominas.find(n => n.id === linea.nominaId);
          if (nom) {
            if (!nom.lineas) nom.lineas = [];
            if (!nom.lineas.find(l => l.empleadoId === linea.empleadoId)) {
              nom.lineas.push({ empleadoId: linea.empleadoId, diasTrabajados: parseFloat(linea.diasTrabajados)||0, horasExtras: parseFloat(linea.horasExtras)||0, totalDevengado: parseFloat(linea.totalDevengado)||0 });
            }
          }
        });
      } else if (tabla === 'vacacionesControl') {
        STATE.vacacionesControl = data.map(r => ({ empleadoId: r.empleadoId, ano: parseInt(r.ano)||0, diasTomados: parseInt(r.diasTomados)||0 }));
      } else {
        STATE[tabla] = data;
      }
    });
    // Config
    try {
      const cfgRes = await apiCall({ accion: 'leerConfig', tabla: 'config' });
      const cfg = cfgRes.data || {};
      if (cfg.pinRrhh)        STATE.config.pins.rrhh          = cfg.pinRrhh;
      if (cfg.pinJuridico)    STATE.config.pins.juridico       = cfg.pinJuridico;
      if (cfg.pinContabilidad)STATE.config.pins.contabilidad   = cfg.pinContabilidad;
      if (cfg.bonAnios1)      STATE.config.bonificacion.anios1 = parseInt(cfg.bonAnios1);
      if (cfg.bonNivel1)      STATE.config.bonificacion.nivel1 = parseInt(cfg.bonNivel1);
      if (cfg.bonAnios2)      STATE.config.bonificacion.anios2 = parseInt(cfg.bonAnios2);
      if (cfg.bonNivel2)      STATE.config.bonificacion.nivel2 = parseInt(cfg.bonNivel2);
      if (cfg.recargoHE)      STATE.config.recargoHorasExtras  = parseFloat(cfg.recargoHE);
      if (cfg.diasVacaciones) STATE.config.diasVacaciones      = parseInt(cfg.diasVacaciones);
      if (cfg.diasPagados)    STATE.config.diasPagadosPeriodo  = parseInt(cfg.diasPagados);
    } catch(e) {}
    saveState();
    DB_ONLINE = true; updateSyncBadge(true);
    showSyncIndicator('✅ Sincronizado con Sheets', 'ok');
  } catch(err) {
    DB_ONLINE = false; updateSyncBadge(false);
    showSyncIndicator('⚠️ Modo offline — usando datos locales', 'offline');
  }
}
setInterval(async () => {
  if (!DB_ONLINE && DB_PENDING_OPS.length > 0) {
    try { await apiCall({ accion: 'ping' }); DB_ONLINE = true; updateSyncBadge(true); await flushPendingOps(); } catch(e) {}
  }
}, 60000);
function getDefaultState() {
  return {
    config:{
      pins:{rrhh:'1111',juridico:'2222',contabilidad:'3333'},
      adminPin:'1059',
      bonificacion:{nivel1:5,anios1:5,nivel2:10,anios2:10},
      recargoHorasExtras:50, diasVacaciones:14, diasPagadosPeriodo:15
    },
    empleados:[], traslados:[], bajas:[], sanciones:[],
    nominas:[], incidencias:[], vacacionesControl:[],
    historialSalarial:[], documentos:{}, auditLog:[], nextId:1
  };
}
let STATE = loadState();
let currentRole = null;
let currentSection = 'dashboard';
let selectedRole = null;

// ══════════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════════
function selectRole(role,btn){
  selectedRole=role;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('p0').focus();
}
function pinNav(idx){
  const v=document.getElementById('p'+idx).value;
  if(v&&idx<3)document.getElementById('p'+(idx+1)).focus();
  if(idx===3&&v)doLogin();
}
function pinBack(e,idx){
  if(e.key==='Backspace'&&!document.getElementById('p'+idx).value&&idx>0)document.getElementById('p'+(idx-1)).focus();
  if(e.key==='Enter')doLogin();
}
function getPin(){return['p0','p1','p2','p3'].map(id=>document.getElementById(id).value).join('')}
function clearPin(){['p0','p1','p2','p3'].forEach(id=>{document.getElementById(id).value=''});document.getElementById('p0').focus()}
function doLogin(){
  if(!selectedRole){showToast('Seleccione un departamento','warning');return}
  const pin=getPin();
  if(pin.length<4){showToast('Ingrese los 4 dígitos del PIN','warning');return}
  const v={admin:STATE.config.adminPin,rrhh:STATE.config.pins.rrhh,juridico:STATE.config.pins.juridico,contabilidad:STATE.config.pins.contabilidad};
  if(pin===v[selectedRole]){
    currentRole=selectedRole;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    addAuditLog('LOGIN','Inicio de sesión como '+getRoleName(currentRole));
    renderSidebar();
    navigateTo('dashboard');
    // Sincronizar con Sheets al iniciar sesión
    setTimeout(() => sincronizarDesdeSheets(), 500);
  } else {
    document.getElementById('login-error').style.display='block';
    clearPin();
    setTimeout(()=>{document.getElementById('login-error').style.display='none'},3000);
  }
}
function doLogout(){
  currentRole=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  selectedRole=null;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('selected'));
  clearPin();
}
function getRoleName(r){return{admin:'Administración',rrhh:'RRHH',juridico:'Jurídico',contabilidad:'Contabilidad'}[r]||r}
function getRoleIcon(r){return{admin:'👑',rrhh:'👥',juridico:'⚖️',contabilidad:'📊'}[r]||'👤'}

// ══════════════════════════════════════════════════
// SIDEBAR & NAVIGATION
// ══════════════════════════════════════════════════
const NAV_ITEMS = {
  admin:[
    {section:'dashboard',icon:'📈',label:'Dashboard'},
    {section:'empleados',icon:'👥',label:'Empleados',header:'RRHH'},
    {section:'alta',icon:'➕',label:'Alta de Empleado'},
    {section:'expedientes',icon:'📁',label:'Expedientes'},
    {section:'traslados',icon:'🔄',label:'Traslados'},
    {section:'bajas',icon:'📤',label:'Bajas'},
    {section:'salarios',icon:'💰',label:'Salarios Base',header:'ADMINISTRACIÓN'},
    {section:'contratos',icon:'📄',label:'Contratos',header:'JURÍDICO'},
    {section:'sanciones',icon:'⚠️',label:'Sanciones'},
    {section:'nomina',icon:'📋',label:'Nóminas',header:'CONTABILIDAD'},
    {section:'incidencias',icon:'🗓️',label:'Incidencias'},
    {section:'vacaciones',icon:'🌴',label:'Vacaciones'},
    {section:'configuracion',icon:'⚙️',label:'Configuración',header:'SISTEMA'},
    {section:'auditoria',icon:'📝',label:'Auditoría'},
    {section:'backup',icon:'💾',label:'Copia de Seguridad'}
  ],
  rrhh:[
    {section:'dashboard',icon:'📈',label:'Dashboard'},
    {section:'empleados',icon:'👥',label:'Empleados',header:'PERSONAL'},
    {section:'alta',icon:'➕',label:'Alta de Empleado'},
    {section:'expedientes',icon:'📁',label:'Expedientes'},
    {section:'traslados',icon:'🔄',label:'Traslados'},
    {section:'bajas',icon:'📤',label:'Bajas'}
  ],
  juridico:[
    {section:'dashboard',icon:'📈',label:'Dashboard'},
    {section:'empleados',icon:'👥',label:'Empleados',header:'PERSONAL'},
    {section:'expedientes',icon:'📁',label:'Expedientes'},
    {section:'contratos',icon:'📄',label:'Contratos',header:'JURÍDICO'},
    {section:'sanciones',icon:'⚠️',label:'Sanciones'},
    {section:'bajas',icon:'📤',label:'Ver Bajas'}
  ],
  contabilidad:[
    {section:'dashboard',icon:'📈',label:'Dashboard'},
    {section:'empleados',icon:'👥',label:'Empleados',header:'CONSULTA'},
    {section:'nomina',icon:'📋',label:'Nóminas',header:'CONTABILIDAD'},
    {section:'incidencias',icon:'🗓️',label:'Incidencias'},
    {section:'vacaciones',icon:'🌴',label:'Vacaciones'}
  ]
};

function renderSidebar(){
  document.getElementById('role-badge').textContent=getRoleIcon(currentRole)+' '+getRoleName(currentRole);
  const nav=document.getElementById('sidebar-nav');
  const items=NAV_ITEMS[currentRole]||[];
  let html='',curH=null;
  items.forEach(item=>{
    if(item.header&&item.header!==curH){curH=item.header;html+=`<div class="nav-section"><div class="nav-section-label">${item.header}</div>`}
    html+=`<div class="nav-section"><div class="nav-item" data-section="${item.section}" onclick="navigateTo('${item.section}')"><span class="nav-icon">${item.icon}</span><span>${item.label}</span></div></div>`;
  });
  nav.innerHTML=html;
}

function navigateTo(section){
  currentSection=section;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.section===section));
  const titles={dashboard:'Dashboard',empleados:'Empleados',alta:'Alta de Empleado',expedientes:'Expedientes Laborales',traslados:'Traslados',bajas:'Bajas',salarios:'Salarios Base',contratos:'Contratos',sanciones:'Sanciones',nomina:'Nóminas',incidencias:'Incidencias',vacaciones:'Submayor de Vacaciones',configuracion:'Configuración',auditoria:'Log de Auditoría',backup:'Copia de Seguridad'};
  document.getElementById('page-title').textContent=titles[section]||section;
  document.getElementById('topbar-actions').innerHTML='';
  const content=document.getElementById('app-content');
  const renders={dashboard:renderDashboard,empleados:renderEmpleados,alta:renderAlta,expedientes:renderExpedientes,traslados:renderTraslados,bajas:renderBajas,salarios:renderSalarios,contratos:renderContratos,sanciones:renderSanciones,nomina:renderNomina,incidencias:renderIncidencias,vacaciones:renderVacaciones,configuracion:renderConfiguracion,auditoria:renderAuditoria,backup:renderBackup};
  if(renders[section])renders[section](content);
  else content.innerHTML='<div class="empty-state"><div class="empty-icon">🚧</div><h4>En construcción</h4></div>';
}

// ══════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════
function uid(){return(STATE.nextId++).toString().padStart(6,'0')}
function addAuditLog(tipo,detalle){
  const entry={fecha:new Date().toISOString(),rol:getRoleName(currentRole),tipo,detalle};
  STATE.auditLog.unshift(entry);
  if(STATE.auditLog.length>2000)STATE.auditLog.pop();
  saveState();
  // Push audit async silently (no esperamos)
  if(typeof pushToSheets === 'function') pushToSheets('auditLog','insertar', entry);
}
function showToast(msg,type='info',dur=3500){
  const c=document.getElementById('toast-container');
  const div=document.createElement('div');
  div.className=`toast toast-${type}`;
  div.innerHTML=`<span>${{success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'}[type]||'ℹ️'}</span><span>${msg}</span>`;
  c.appendChild(div);
  setTimeout(()=>{div.style.opacity='0';div.style.transition='opacity 0.4s';setTimeout(()=>div.remove(),400)},dur);
}
function openModal(title,body,footer='',size=''){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  const mf=document.getElementById('modal-footer');
  if(footer){mf.innerHTML=footer;mf.style.display='flex'}else{mf.innerHTML='';mf.style.display='none'}
  document.getElementById('modal-box').className='modal'+(size?' modal-'+size:'');
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open')}
function confirmAction(msg,cb){
  openModal('Confirmar acción',`<div class="confirm-box" style="text-align:center"><div style="font-size:48px;margin-bottom:12px">⚠️</div><p style="color:var(--text-mid);margin-bottom:20px">${msg}</p></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="closeModal();(${cb.toString()})()">Confirmar</button>`,'sm');
}
function fmtDate(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return d}}
function fmtMoney(n){if(n==null||isNaN(n))return'—';return new Intl.NumberFormat('es-ES',{style:'currency',currency:'USD',minimumFractionDigits:2}).format(n)}
function calcAntiguedad(fechaAlta){if(!fechaAlta)return 0;return Math.floor((new Date()-new Date(fechaAlta))/(1000*60*60*24*365.25))}
function calcBonificacion(sal,fechaAlta){
  const a=calcAntiguedad(fechaAlta),c=STATE.config.bonificacion;
  if(a>=c.anios2)return sal*(c.nivel2/100);
  if(a>=c.anios1)return sal*(c.nivel1/100);
  return 0;
}
function getBonificacionPct(fechaAlta){
  const a=calcAntiguedad(fechaAlta),c=STATE.config.bonificacion;
  if(a>=c.anios2)return c.nivel2;
  if(a>=c.anios1)return c.nivel1;
  return 0;
}

function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Error lectura'));r.readAsDataURL(file)})}
function downloadBase64(b64,filename){const a=document.createElement('a');a.href=b64;a.download=filename;a.click()}

function getCertMedicoStatus(emp){
  const doc=STATE.documentos[emp.id]||{};
  if(!doc.certMedicoFecha)return{status:'sin',label:'Sin certificado',color:'text-muted'};
  const exp=new Date(doc.certMedicoFecha);
  exp.setMonth(exp.getMonth()+6);
  const hoy=new Date();
  const diff=Math.ceil((exp-hoy)/(1000*60*60*24));
  if(diff<0)return{status:'vencido',label:`Vencido hace ${Math.abs(diff)} días`,color:'cert-exp',exp};
  if(diff<=30)return{status:'proximo',label:`Vence en ${diff} días`,color:'cert-warn',exp};
  return{status:'ok',label:`Vigente (vence ${fmtDate(exp.toISOString())})`,color:'cert-ok',exp};
}

function applyFilters(){
  const nom=(document.getElementById('f-nombre')||{}).value||'';
  const dept=(document.getElementById('f-dept')||{}).value||'';
  const est=(document.getElementById('f-estado')||{}).value||'';
  const cls=(document.getElementById('f-cls')||{}).value||'';
  const ant=(document.getElementById('f-ant')||{}).value||'';
  const showSalary=currentRole==='admin'||currentRole==='contabilidad';
  let emps=STATE.empleados.filter(e=>{
    if(nom&&!`${e.nombres} ${e.apellidos}`.toLowerCase().includes(nom.toLowerCase()))return false;
    if(dept&&e.departamento!==dept)return false;
    if(est==='Activo'&&!e.activo)return false;
    if(est==='Baja'&&e.activo)return false;
    if(cls&&e.clasificacion!==cls)return false;
    if(ant){const a=calcAntiguedad(e.fechaAlta);if(ant==='0-4'&&a>=5)return false;if(ant==='5-9'&&(a<5||a>=10))return false;if(ant==='10+'&&a<10)return false}
    return true;
  });
  const tbody=document.getElementById('emp-tbody');
  if(!tbody)return;
  if(!emps.length){tbody.innerHTML=`<tr><td colspan="20" class="text-center text-muted" style="padding:40px">No hay empleados con esos filtros</td></tr>`;return}
  tbody.innerHTML=emps.map(e=>{
    const a=calcAntiguedad(e.fechaAlta);
    const bPct=getBonificacionPct(e.fechaAlta);
    const bon=calcBonificacion(e.salarioBase||0,e.fechaAlta);
    const total=(e.salarioBase||0)+bon;
    const doc=STATE.documentos[e.id]||{};
    const cs=getCertMedicoStatus(e);
    const foto=doc.fotoCarnet?`<img src="${doc.fotoCarnet}" style="width:36px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--border)">`:`<div style="width:36px;height:44px;background:var(--cream-dark);border-radius:4px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:16px">👤</div>`;
    return `<tr>
      <td>${foto}</td>
      <td><strong>${e.nombres} ${e.apellidos}</strong></td>
      <td><code>${e.carnet}</code></td>
      <td><span class="chip">${e.departamento||'—'}</span></td>
      <td>${e.plaza||'—'}</td>
      ${showSalary?`<td>${fmtMoney(e.salarioBase)}</td><td>${bPct?bPct+'%':'—'}</td><td><strong>${fmtMoney(total)}</strong></td>`:''}
      <td><span class="tag tag-${(e.clasificacion||'').toLowerCase()}">${e.clasificacion||'—'}</span></td>
      <td>${e.jornada||'—'}d</td>
      <td>${a} año${a===1?'':'s'}</td>
      <td><span class="${cs.color}" style="font-size:12px">${cs.status==='vencido'?'🔴':cs.status==='proximo'?'🟡':cs.status==='ok'?'🟢':'⚪'} ${cs.label}</span></td>
      <td><span class="badge ${e.activo?'badge-active':'badge-inactive'}">${e.activo?'Activo':'Baja'}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn-secondary btn-xs" onclick="verFicha('${e.id}')">👁️ Ficha</button>
        <button class="btn btn-gold btn-xs" onclick="navigateTo('expedientes');setTimeout(()=>verExpediente('${e.id}'),200)">📁</button>
      </td>
    </tr>`;
  }).join('');
}

  const doc=STATE.documentos[id]||{};

    body+=`<div class="divider"></div><b>⚠️ Sanciones</b><br><br><div class="history-list">${sanciones.map(s=>`<div class="history-item" style="border-left-color:var(--danger)"><div class="hi-date">${fmtDate(s.fecha)}</div><div><b>${s.tipo}</b> — ${s.motivo}</div></div>`).join('')}</div>`;
  }

  // Documentos
  body+=`<div class="divider"></div><b>📎 Documentos Adjuntos</b><br><br><div style="display:flex;gap:8px;flex-wrap:wrap">`;
  if(doc.obligaciones)body+=`<button class="btn btn-secondary btn-xs" onclick="downloadBase64('${doc.obligaciones}','Obligaciones_${e.nombres.replace(/ /g,'_')}.pdf')">📄 Obligaciones</button>`;
  if(doc.contrato)body+=`<button class="btn btn-secondary btn-xs" onclick="downloadBase64('${doc.contrato}','Contrato_${e.nombres.replace(/ /g,'_')}.pdf')">📑 Contrato PDF</button>`;
  body+=`</div>`;

  // Licencias y cert adicionales
  if(licencias.length){
    body+=`<div class="divider"></div><b>🏅 Certificados y Licencias</b><br><br><div class="img-grid">`;
    licencias.forEach((lic,i)=>{
      body+=`<div class="img-thumb"><img src="${lic.data}" title="${lic.nombre}" onclick="window.open('${lic.data}','_blank')"></div>`;
    });
    body+=`</div>`;
  }

  const canEditData=(currentRole==='admin'||currentRole==='rrhh');
  const canEditCuenta=(currentRole==='admin'||currentRole==='contabilidad');
  const canContract=(currentRole==='admin'||currentRole==='juridico');

  const footer=`
    <button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>
    <button class="btn btn-secondary btn-sm" onclick="exportFichaExcel('${id}')">⬇️ Excel</button>
    ${canEditData?`<button class="btn btn-info btn-sm" onclick="closeModal();editarEmpleado('${id}')">✏️ Editar Datos</button>`:''}
    ${canEditCuenta?`<button class="btn btn-gold btn-sm" onclick="editarCuenta('${id}')">🏦 Editar Cuenta</button>`:''}
    ${canContract?`<button class="btn btn-primary btn-sm" onclick="previewContrato('${id}')">📄 Generar Contrato</button>`:''}
    ${currentRole==='admin'&&!e.activo?`<button class="btn btn-success btn-sm" onclick="closeModal();restaurarEmpleado('${id}')">♻️ Restaurar</button>`:''}`;

  openModal(`Ficha: ${e.nombres} ${e.apellidos}`,body,footer,'lg');
}

function editarCuenta(id){
  const e=STATE.empleados.find(x=>x.id===id);
  openModal('🏦 Editar Cuenta Bancaria',
    `<p style="margin-bottom:12px"><b>${e.nombres} ${e.apellidos}</b></p>
    <div class="form-group">
      <label class="field-label required" data-tip="Exactamente 16 dígitos numéricos">Número de Cuenta (16 dígitos)</label>
      <input type="text" id="cuenta-input" value="${e.cuenta||''}" maxlength="16" placeholder="1234567890123456" oninput="this.value=this.value.replace(/\D/g,'').slice(0,16)">
      <div class="input-hint" id="cuenta-hint">${e.cuenta?e.cuenta.length+'/16 dígitos':'0/16 dígitos'}</div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="guardarCuenta('${id}')">💾 Guardar</button>`,'sm');
  setTimeout(()=>{
    const inp=document.getElementById('cuenta-input');
    if(inp)inp.addEventListener('input',()=>{document.getElementById('cuenta-hint').textContent=inp.value.length+'/16 dígitos'});
  },100);
}

function guardarCuenta(id){
  const val=document.getElementById('cuenta-input').value;
  if(val.length!==16||!/^\d{16}$/.test(val)){showToast('La cuenta debe tener exactamente 16 dígitos numéricos','error');return}
  const emp=STATE.empleados.find(e=>e.id===id);
  emp.cuenta=val;
  saveState();
  addAuditLog('EDICION_CUENTA',`Cuenta bancaria actualizada para ${emp.nombres} ${emp.apellidos} por ${getRoleName(currentRole)}`);
  showToast('Cuenta bancaria actualizada','success');
  closeModal();
}

function exportFichaExcel(id){
  const e=STATE.empleados.find(x=>x.id===id);
  if(!e)return;
  exportToExcel([{Nombre:`${e.nombres} ${e.apellidos}`,Carnet:e.carnet,Teléfono:e.telefono,'F.Nacimiento':fmtDate(e.fechaNacimiento),Dirección:e.direccion,NSS:e.nss,NIF:e.nif,Banco:e.banco,Cuenta:e.cuenta,Profesión:e.profesion,'Tipo Contrato':e.tipoContrato,Departamento:e.departamento,Plaza:e.plaza,Clasificación:e.clasificacion,Jornada:e.jornada,'Fecha Alta':fmtDate(e.fechaAlta),'Antigüedad':calcAntiguedad(e.fechaAlta)+' años','Salario Base':e.salarioBase,Estado:e.activo?'Activo':'Baja'}],`Ficha_${e.nombres.replace(/ /g,'_')}`);
  showToast('Ficha exportada','success');
}

  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Contrato — La Catedral</title>

  w.document.close();
  setTimeout(()=>w.print(),600);
}

    </div></div></div>`;

  updatePlazas();
  if(d.departamento){setTimeout(()=>{const sel=document.getElementById('a-plaza');if(sel&&d.plaza){for(let opt of sel.options){if(opt.value===d.plaza){opt.selected=true;break}}}},50)}
}

// Temp store for new licencias being added in form
let tempLicencias = [];
let tempFotoCarnet = null;

function previewFotoCarnet(input){
  if(!input.files[0])return;
  const reader=new FileReader();
  reader.onload=e=>{
    tempFotoCarnet=e.target.result;
    const prev=document.getElementById('foto-preview');
    const placeholder=document.getElementById('foto-placeholder');
    if(prev){prev.src=e.target.result;prev.style.display='block'}
    if(placeholder)placeholder.style.display='none';
  };
  reader.readAsDataURL(input.files[0]);
}

function clearFoto(){
  tempFotoCarnet='__clear__';
  const prev=document.getElementById('foto-preview');
  const placeholder=document.getElementById('foto-placeholder');
  if(prev){prev.src='';prev.style.display='none'}
  if(placeholder)placeholder.style.display='flex';
}

function previewFile(input,labelId){
  const label=document.getElementById(labelId);
  if(input.files[0]&&label)label.textContent='✅ '+input.files[0].name;
}

function previewLicencias(input){
  const files=Array.from(input.files);
  const container=document.getElementById('licencias-preview');
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const idx=tempLicencias.length;
      tempLicencias.push({nombre:file.name,data:e.target.result});
      const div=document.createElement('div');div.className='img-thumb';div.id='lic-'+idx;
      const isPdf=file.type==='application/pdf';
      div.innerHTML=`${isPdf?`<div style="width:80px;height:80px;background:var(--cream-dark);border-radius:4px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:28px">📄</div>`:`<img src="${e.target.result}" title="${file.name}">`}<button class="img-remove" onclick="removeTempLic(${idx})">✕</button>`;
      if(container)container.appendChild(div);
    };
    reader.readAsDataURL(file);
  });
}

function removeTempLic(idx){
  tempLicencias.splice(idx,1);
  const el=document.getElementById('lic-'+idx);
  if(el)el.remove();
}

function removeLicencia(idx){
  const empId=document.getElementById('alta-form')?null:null; // handled differently
  showToast('Para eliminar licencias guardadas, use la edición completa','info');
}

function updatePlazas(){
  const dept=document.getElementById('a-departamento');
  const plaza=document.getElementById('a-plaza');
  if(!dept||!plaza)return;
  plaza.innerHTML=(PLAZAS[dept.value]||[]).map(p=>`<option>${p}</option>`).join('');
}

async function guardarAlta(){
  const nombres=document.getElementById('a-nombres').value.trim();
  const apellidos=document.getElementById('a-apellidos').value.trim();
  const carnet=document.getElementById('a-carnet').value.trim();
  const fechaAlta=document.getElementById('a-fechaAlta').value;
  if(!nombres||!apellidos||!carnet||!fechaAlta){showToast('Complete los campos obligatorios','warning');return}
  if(!/^\d{11}$/.test(carnet)){showToast('El carnet debe tener exactamente 11 dígitos','error');return}
  if(STATE.empleados.find(e=>e.carnet===carnet)){showToast('Ya existe un empleado con ese carnet','error');return}
  const cuenta=document.getElementById('a-cuenta').value;
  if(cuenta&&cuenta.length!==16){showToast('La cuenta debe tener exactamente 16 dígitos','error');return}

  const id='E'+uid();
  const emp={
    id,fechaAlta,nombres,apellidos,carnet,
    telefono:document.getElementById('a-telefono').value,
    fechaNacimiento:document.getElementById('a-fechaNacimiento').value,
    direccion:document.getElementById('a-direccion').value,
    nss:document.getElementById('a-nss').value,
    nif:document.getElementById('a-nif').value,
    banco:document.getElementById('a-banco').value,
    cuenta:(currentRole==='admin'||currentRole==='contabilidad')?cuenta:'',
    profesion:document.getElementById('a-profesion').value,
    tipoContrato:document.getElementById('a-contrato').value,
    clasificacion:document.getElementById('a-clasificacion').value,
    jornada:parseInt(document.getElementById('a-jornada').value),
    departamento:document.getElementById('a-departamento').value,
    plaza:document.getElementById('a-plaza').value,
    salarioBase:null,activo:true
  };
  STATE.empleados.push(emp);
  // Push a Sheets (async, no bloquea UI)
  pushToSheets('empleados','insertar', emp);

  const docData={};

  // Foto carnet
  if(tempFotoCarnet&&tempFotoCarnet!=='__clear__')docData.fotoCarnet=tempFotoCarnet;
  tempFotoCarnet=null;

  // Cert médico fecha
  const certFecha=document.getElementById('a-certFecha').value;
  if(certFecha)docData.certMedicoFecha=certFecha;

  // Cert médico archivo
  const certInput=document.getElementById('a-certMedico');
  if(certInput&&certInput.files[0]){
    try{docData.certMedico=await fileToBase64(certInput.files[0])}catch(e){}
  }

  // PDF Obligaciones
  const pdfObl=document.getElementById('a-pdf-obl');
  if(pdfObl&&pdfObl.files[0]){try{docData.obligaciones=await fileToBase64(pdfObl.files[0])}catch(e){}}

  // Licencias
  if(tempLicencias.length)docData.licencias=tempLicencias.slice();
  tempLicencias=[];

  STATE.documentos[id]=docData;
  saveState();
  addAuditLog('ALTA',`Alta empleado: ${nombres} ${apellidos} (${carnet}) — ${emp.departamento}/${emp.plaza} — Expediente #${carnet}`);
  showToast(`Empleado registrado. Expediente #${carnet}. Administración debe asignar salario.`,'success',5000);
  navigateTo('empleados');
}

function editarEmpleado(id){
  const emp=STATE.empleados.find(e=>e.id===id);
  if(!emp)return;
  tempLicencias=[];tempFotoCarnet=null;
  renderAlta(document.getElementById('app-content'),emp);
  document.getElementById('page-title').textContent='Editar Empleado';
}

async function guardarEdicionEmpleado(id){
  const emp=STATE.empleados.find(e=>e.id===id);
  if(!emp)return;
  const carnet=document.getElementById('a-carnet').value.trim();
  if(!/^\d{11}$/.test(carnet)){showToast('El carnet debe tener exactamente 11 dígitos','error');return}
  const existing=STATE.empleados.find(e=>e.carnet===carnet&&e.id!==id);
  if(existing){showToast('Ya existe otro empleado con ese carnet','error');return}
  const cuenta=document.getElementById('a-cuenta').value;
  if(cuenta&&cuenta.length!==16){showToast('La cuenta debe tener exactamente 16 dígitos','error');return}

  Object.assign(emp,{
    fechaAlta:document.getElementById('a-fechaAlta').value,
    nombres:document.getElementById('a-nombres').value.trim(),
    apellidos:document.getElementById('a-apellidos').value.trim(),
    carnet,
    telefono:document.getElementById('a-telefono').value,
    fechaNacimiento:document.getElementById('a-fechaNacimiento').value,
    direccion:document.getElementById('a-direccion').value,
    nss:document.getElementById('a-nss').value,
    nif:document.getElementById('a-nif').value,
    banco:document.getElementById('a-banco').value,
    profesion:document.getElementById('a-profesion').value,
    tipoContrato:document.getElementById('a-contrato').value,
    clasificacion:document.getElementById('a-clasificacion').value,
    jornada:parseInt(document.getElementById('a-jornada').value),
    departamento:document.getElementById('a-departamento').value,
    plaza:document.getElementById('a-plaza').value
  });
  if((currentRole==='admin'||currentRole==='contabilidad')&&cuenta)emp.cuenta=cuenta;

  const docData=STATE.documentos[id]||{};

  // Foto carnet
  if(tempFotoCarnet&&tempFotoCarnet!=='__clear__')docData.fotoCarnet=tempFotoCarnet;
  if(tempFotoCarnet==='__clear__')delete docData.fotoCarnet;
  tempFotoCarnet=null;

  // Cert médico
  const certFecha=document.getElementById('a-certFecha').value;
  if(certFecha)docData.certMedicoFecha=certFecha;
  const certInput=document.getElementById('a-certMedico');
  if(certInput&&certInput.files[0]){try{docData.certMedico=await fileToBase64(certInput.files[0])}catch(e){}}

  // Obligaciones
  const pdfObl=document.getElementById('a-pdf-obl');
  if(pdfObl&&pdfObl.files[0]){try{docData.obligaciones=await fileToBase64(pdfObl.files[0])}catch(e){}}

  // Nuevas licencias
  if(tempLicencias.length){
    if(!docData.licencias)docData.licencias=[];
    docData.licencias=[...(docData.licencias||[]),...tempLicencias];
    tempLicencias=[];
  }

  STATE.documentos[id]=docData;
  saveState();
  pushToSheets('empleados','actualizar', emp.id, emp);
  addAuditLog('EDICION',`Edición empleado: ${emp.nombres} ${emp.apellidos} por ${getRoleName(currentRole)}`);
  showToast('Empleado actualizado','success');
  navigateTo('empleados');
}

function renderExpedientes(container){
  const activos=STATE.empleados;
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-secondary btn-sm" onclick="exportExpedientes()">⬇️ Exportar</button>`;
  container.innerHTML=`<div class="card">
    <div class="filters-bar">
      <input type="text" id="exp-q" placeholder="🔍 Buscar por nombre o número de carnet..." style="min-width:300px" oninput="filtrarExpedientes()">

    <div class="table-wrap"><table>
      <thead><tr><th>N° Expediente</th><th>Nombre</th><th>Departamento</th><th>Plaza</th><th>Fecha Alta</th><th>Estado</th><th>Ver</th></tr></thead>

function renderExpedientesRows(lista){
  if(!lista.length)return`<tr><td colspan="7" class="text-center text-muted" style="padding:40px">Sin expedientes</td></tr>`;
  return lista.map(e=>`<tr>
    <td><code style="font-size:13px;font-weight:700;color:var(--burgundy)">${e.carnet}</code></td>
    <td><b>${e.nombres} ${e.apellidos}</b></td>
    <td>${e.departamento||'—'}</td><td>${e.plaza||'—'}</td>
    <td>${fmtDate(e.fechaAlta)}</td>
    <td><span class="badge ${e.activo?'badge-active':'badge-inactive'}">${e.activo?'Activo':'Baja'}</span></td>
    <td><button class="btn btn-primary btn-xs" onclick="verExpediente('${e.id}')">📁 Abrir</button></td>
  </tr>`).join('');
}

function filtrarExpedientes(){
  const q=(document.getElementById('exp-q')||{}).value||'';
  const est=(document.getElementById('exp-estado')||{}).value||'';
  const lista=STATE.empleados.filter(e=>{
    const match=`${e.nombres} ${e.apellidos} ${e.carnet}`.toLowerCase().includes(q.toLowerCase());
    if(!match)return false;
    if(est==='Activo'&&!e.activo)return false;
    if(est==='Baja'&&e.activo)return false;
    return true;
  });
  const tbody=document.getElementById('exp-tbody');
  if(tbody)tbody.innerHTML=renderExpedientesRows(lista);
}

function verExpediente(id){
  const e=STATE.empleados.find(x=>x.id===id);
  if(!e)return;
  const doc=STATE.documentos[id]||{};
  const traslados=STATE.traslados.filter(t=>t.empleadoId===id);
  const bajas=STATE.bajas.filter(b=>b.empleadoId===id);
  const sanciones=(currentRole==='admin'||currentRole==='juridico')?STATE.sanciones.filter(s=>s.empleadoId===id):[];
  const cs=getCertMedicoStatus(e);

  // Build timeline events
  const events=[];
  events.push({fecha:e.fechaAlta,tipo:'ALTA',titulo:'Alta Laboral',desc:`Departamento: ${e.departamento} | Plaza: ${e.plaza} | Jornada: ${e.jornada} días`,color:'green'});
  traslados.forEach(t=>events.push({fecha:t.fecha,tipo:'TRASLADO',titulo:'Traslado',desc:`${t.deptAnterior} → ${t.deptNuevo} | ${t.plazaNueva} | ${t.motivo}`,color:'blue'}));
  sanciones.forEach(s=>events.push({fecha:s.fecha,tipo:'SANCION',titulo:`Sanción: ${s.tipo}`,desc:s.motivo,color:'red'}));
  bajas.forEach(b=>events.push({fecha:b.fecha,tipo:'BAJA',titulo:'Baja Laboral',desc:b.motivo,color:'red'}));
  if(!e.activo&&!bajas.length&&e.fechaBaja)events.push({fecha:e.fechaBaja,tipo:'BAJA',titulo:'Baja Laboral',desc:'Registrada en el sistema',color:'red'});
  events.sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));

  const licencias=doc.licencias||[];

  let body=`<div style="display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap">
    <div>
      ${doc.fotoCarnet?`<img src="${doc.fotoCarnet}" class="foto-carnet-preview">`:`<div class="foto-carnet-placeholder"><span style="font-size:28px">👤</span></div>`}
    </div>
    <div style="flex:1">
      <div style="background:var(--cream-dark);border-radius:8px;padding:12px 16px;margin-bottom:10px">
        <div style="font-size:12px;color:var(--text-light);text-transform:uppercase;letter-spacing:1px">N° de Expediente</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--burgundy)">${e.carnet}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
        <div><b>Nombre:</b> ${e.nombres} ${e.apellidos}</div>
        <div><b>Dpto/Plaza:</b> ${e.departamento}/${e.plaza}</div>
        <div><b>Alta:</b> ${fmtDate(e.fechaAlta)}</div>
        <div><b>Antigüedad:</b> ${calcAntiguedad(e.fechaAlta)} años</div>
        <div><b>Clasificación:</b> ${e.clasificacion}</div>
        <div><b>Estado:</b> <span class="badge ${e.activo?'badge-active':'badge-inactive'}">${e.activo?'Activo':'Baja'}</span></div>
        <div style="grid-column:1/-1"><b>Cert.Médico:</b> <span class="${cs.color}">${cs.status==='vencido'?'🔴':cs.status==='proximo'?'🟡':cs.status==='ok'?'🟢':'⚪'} ${cs.label}</span></div>
      </div>
    </div>
  </div>

  <div class="divider"></div>
  <b>📅 Línea de Tiempo del Expediente</b><br><br>
  <div class="timeline">
    ${events.map(ev=>`<div class="timeline-item">
      <div class="timeline-dot ${ev.color}"></div>
      <div class="timeline-content">
        <div class="tl-date">${fmtDate(ev.fecha)} — <span class="chip">${ev.tipo}</span></div>
        <div class="tl-title">${ev.titulo}</div>
        <div class="tl-desc">${ev.desc}</div>
      </div>
    </div>`).join('')}
    ${events.length===0?'<div class="text-muted">Sin eventos registrados</div>':''}
  </div>

  <div class="divider"></div>
  <b>📎 Documentos del Expediente</b><br><br>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    ${doc.obligaciones?`<button class="btn btn-secondary btn-xs" onclick="downloadBase64('${doc.obligaciones}','Obligaciones_${e.nombres.replace(/ /g,'_')}.pdf')">📄 Obligaciones</button>`:''}
    ${doc.contrato?`<button class="btn btn-secondary btn-xs" onclick="downloadBase64('${doc.contrato}','Contrato_${e.nombres.replace(/ /g,'_')}.pdf')">📑 Contrato</button>`:''}
    ${doc.certMedico?`<button class="btn btn-secondary btn-xs" onclick="downloadBase64('${doc.certMedico}','CertMedico_${e.nombres.replace(/ /g,'_')}.pdf')">🏥 Cert.Médico</button>`:''}
    ${!doc.obligaciones&&!doc.contrato&&!doc.certMedico?'<span class="text-muted">Sin documentos PDF adjuntos</span>':''}
  </div>`;

  if(licencias.length){
    body+=`<b>🏅 Certificados y Licencias</b><br><div class="img-grid" style="margin-top:8px">
    ${licencias.map((lic,i)=>`<div class="img-thumb"><img src="${lic.data}" title="${lic.nombre}" onclick="window.open('${lic.data}','_blank')" style="cursor:pointer"></div>`).join('')}
    </div>`;
  }

  const footer=`<button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>
    ${currentRole==='admin'||currentRole==='juridico'?`<button class="btn btn-primary btn-sm" onclick="previewContrato('${id}')">📄 Generar Contrato</button>`:''}
    ${currentRole==='admin'||currentRole==='rrhh'?`<button class="btn btn-gold btn-sm" onclick="closeModal();editarEmpleado('${id}')">✏️ Editar</button>`:''}`;

  openModal(`📁 Expediente #${e.carnet} — ${e.nombres} ${e.apellidos}`,body,footer,'lg');
}

function openModalTraslado(){
  const activos=getEmpleadosActivos();
  const depts=Object.keys(PLAZAS);
  openModal('🔄 Registrar Traslado',
    `<div class="form-grid">
      <div class="form-group full"><label class="field-label required">Empleado</label>
        <select id="tr-emp"><option value="">Seleccione...</option>${activos.map(e=>`<option value="${e.id}">${e.nombres} ${e.apellidos}</option>`).join('')}</select></div>
      <div class="form-group"><label class="field-label required">Fecha</label><input type="date" id="tr-fecha" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="form-group"><label class="field-label required">Motivo</label><input type="text" id="tr-motivo" placeholder="Motivo del traslado"></div>
      <div class="form-group"><label class="field-label required">Nuevo Departamento</label><select id="tr-dept" onchange="updateTraslPlazas()">${depts.map(d=>`<option>${d}</option>`).join('')}</select></div>
      <div class="form-group"><label class="field-label required">Nueva Plaza</label><select id="tr-plaza"></select></div>
      <div class="form-group"><label class="field-label">Nueva Clasificación</label><select id="tr-cls"><option value="">Sin cambio</option><option>Directo</option><option>Indirecto</option></select></div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarTraslado()">💾 Guardar</button>`);
  setTimeout(updateTraslPlazas,100);
}

function updateTraslPlazas(){
  const dept=document.getElementById('tr-dept');const plaza=document.getElementById('tr-plaza');
  if(!dept||!plaza)return;
  plaza.innerHTML=(PLAZAS[dept.value]||[]).map(p=>`<option>${p}</option>`).join('');
}

function guardarTraslado(){
  const empId=document.getElementById('tr-emp').value;
  const fecha=document.getElementById('tr-fecha').value;
  const motivo=document.getElementById('tr-motivo').value.trim();
  const deptNuevo=document.getElementById('tr-dept').value;
  const plazaNueva=document.getElementById('tr-plaza').value;
  const clsNueva=document.getElementById('tr-cls').value;
  if(!empId||!fecha||!motivo){showToast('Complete los campos requeridos','warning');return}
  const emp=STATE.empleados.find(e=>e.id===empId);
  if(!emp)return;
  const traslado={id:'T'+uid(),empleadoId:empId,fecha,motivo,deptAnterior:emp.departamento,plazaAnterior:emp.plaza,deptNuevo,plazaNueva,clasificacionNueva:clsNueva||emp.clasificacion};
  STATE.traslados.push(traslado);
  emp.departamento=deptNuevo;emp.plaza=plazaNueva;
  if(clsNueva)emp.clasificacion=clsNueva;
  saveState();
  pushToSheets('traslados','insertar', traslado);
  pushToSheets('empleados','actualizar', emp.id, emp);
  addAuditLog('TRASLADO',`Traslado ${emp.nombres} ${emp.apellidos}: ${emp.departamento}→${deptNuevo}/${plazaNueva}`);
  showToast('Traslado registrado. Administración puede revisar salario.','success',4000);
  closeModal();renderTraslados(document.getElementById('app-content'));
}

        <select id="baja-motivo-tipo"><option>Despido</option><option>Renuncia voluntaria</option><option>Jubilación</option><option>Fallecimiento</option><option>Fin de contrato</option><option>Otro</option></select></div>

    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="confirmarBaja()">Registrar Baja</button>`);
}

function confirmarBaja(){
  const empId=document.getElementById('baja-emp').value;
  if(!empId){showToast('Seleccione un empleado','warning');return}
  const emp=STATE.empleados.find(e=>e.id===empId);
  confirmAction(`¿Confirma dar de baja a <b>${emp.nombres} ${emp.apellidos}</b>?`,async function(){
    const fecha=document.getElementById('baja-fecha').value;
    const motivo=document.getElementById('baja-motivo-tipo').value+' — '+(document.getElementById('baja-detalle').value||'');
    const baja={id:'B'+uid(),empleadoId:empId,fecha,motivo,registradoPor:getRoleName(currentRole)};
    STATE.bajas.push(baja);emp.activo=false;emp.fechaBaja=fecha;
    pushToSheets('bajas','insertar', baja);
    pushToSheets('empleados','actualizar', emp.id, emp);
    const pdfInput=document.getElementById('baja-pdf');
    if(pdfInput&&pdfInput.files[0]){try{const b64=await fileToBase64(pdfInput.files[0]);if(!STATE.documentos[empId])STATE.documentos[empId]={};STATE.documentos[empId].bajaPDF=b64}catch(e){}}
    saveState();addAuditLog('BAJA',`Baja: ${emp.nombres} ${emp.apellidos} — ${motivo}`);
    showToast('Empleado dado de baja','warning',4000);
    renderBajas(document.getElementById('app-content'));
  });
}

function restaurarEmpleado(empId){
  const emp=STATE.empleados.find(e=>e.id===empId);if(!emp)return;
  confirmAction(`¿Restaurar a <b>${emp.nombres} ${emp.apellidos}</b> como empleado activo?`,function(){
    emp.activo=true;emp.fechaBaja=null;
    const idx=STATE.bajas.findIndex(b=>b.empleadoId===empId);
    const bajaId=idx>-1?STATE.bajas[idx].id:null;
    if(idx>-1)STATE.bajas.splice(idx,1);
    saveState();
    pushToSheets('empleados','actualizar', emp.id, emp);
    if(bajaId) pushToSheets('bajas','eliminar', null, bajaId);
    addAuditLog('RESTAURACION',`Empleado restaurado: ${emp.nombres} ${emp.apellidos}`);
    showToast('Empleado restaurado','success');navigateTo('bajas');
  });
}

function exportBajas(){
  const data=STATE.bajas.map(b=>{const e=STATE.empleados.find(x=>x.id===b.empleadoId);return{Nombre:e?`${e.nombres} ${e.apellidos}`:'—',Carnet:e?.carnet||'—','Fecha Baja':fmtDate(b.fecha),Motivo:b.motivo,'Registrado por':b.registradoPor}});
  exportToExcel(data,'Bajas_LaCatedral');showToast('Exportado','success');
}

function renderSalarios(container){
  if(currentRole!=='admin'){container.innerHTML='<div class="empty-state"><div class="empty-icon">🔒</div><h4>Solo Administración</h4></div>';return}
  const activos=getEmpleadosActivos();
  container.innerHTML=`<div class="card"><div class="card-header"><h3>💰 Salarios Base</h3></div><div class="table-wrap"><table>
    <thead><tr><th>Empleado</th><th>Departamento</th><th>Plaza</th><th>Jornada</th><th>Antigüedad</th><th>Salario Base</th><th>Bonif.%</th><th>Total</th><th>Acción</th></tr></thead>
    <tbody>${activos.map(e=>{
      const bPct=getBonificacionPct(e.fechaAlta);const bon=calcBonificacion(e.salarioBase||0,e.fechaAlta);
      return`<tr><td><b>${e.nombres} ${e.apellidos}</b></td><td>${e.departamento}</td><td>${e.plaza}</td>
      <td>${e.jornada}d</td><td>${calcAntiguedad(e.fechaAlta)} años</td>
      <td><input type="number" id="sal-${e.id}" value="${e.salarioBase||''}" min="0" step="0.01" style="width:120px" placeholder="0.00"></td>
      <td>${bPct?bPct+'%':'—'}</td>
      <td id="total-${e.id}">${fmtMoney((e.salarioBase||0)+bon)}</td>
      <td><button class="btn btn-primary btn-xs" onclick="guardarSalario('${e.id}')">💾</button></td></tr>`;
    }).join('')}</tbody>
  </table></div></div>`;
}

function guardarSalario(empId){
  const val=parseFloat(document.getElementById('sal-'+empId).value);
  if(isNaN(val)||val<0){showToast('Ingrese un salario válido','error');return}
  openModal('Cambio de Salario',
    `<div class="form-group"><label class="field-label required">Motivo del cambio</label><textarea id="sal-motivo" placeholder="Ej: Incremento anual..."></textarea></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmarSalario('${empId}',${val})">Confirmar</button>`,'sm');
}

function confirmarSalario(empId,nuevo){
  const motivo=document.getElementById('sal-motivo').value.trim();
  if(!motivo){showToast('El motivo es obligatorio','warning');return}
  const emp=STATE.empleados.find(e=>e.id===empId);
  const anterior=emp.salarioBase;
  const regSal={id:'HS'+uid(),empleadoId:empId,fecha:new Date().toISOString(),anterior,nuevo,motivo};
  STATE.historialSalarial.push(regSal);
  emp.salarioBase=nuevo;saveState();
  pushToSheets('historialSalarial','insertar', regSal);
  pushToSheets('empleados','actualizar', emp.id, emp);
  addAuditLog('SALARIO',`Cambio salario ${emp.nombres} ${emp.apellidos}: ${fmtMoney(anterior)}→${fmtMoney(nuevo)} — ${motivo}`);
  showToast('Salario actualizado','success');closeModal();renderSalarios(document.getElementById('app-content'));
}

async function guardarContrato(empId){
  const pdfInput=document.getElementById('contr-pdf');
  if(!pdfInput.files[0]){showToast('Seleccione un archivo PDF','warning');return}
  try{
    const b64=await fileToBase64(pdfInput.files[0]);
    if(!STATE.documentos[empId])STATE.documentos[empId]={};
    STATE.documentos[empId].contrato=b64;saveState();
    const emp=STATE.empleados.find(e=>e.id===empId);
    addAuditLog('CONTRATO',`Contrato adjuntado para ${emp.nombres} ${emp.apellidos}`);
    showToast('Contrato adjuntado','success');closeModal();renderContratos(document.getElementById('app-content'));

  closeModal();adjuntarContratoEmp(empId);
}

  const now=new Date();const mes=now.getMonth()+1;const ano=now.getFullYear();
  document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-secondary btn-sm" onclick="exportNominaActual()">⬇️ Exportar</button>`;
  container.innerHTML=`<div class="tabs">
    <div class="tab active" onclick="switchNominaTab('nueva',this)">📋 Nómina del Mes</div>
